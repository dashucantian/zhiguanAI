<!DOCTYPE html>
<html lang="zh-CN" data-skin="a" data-view="overview">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关系场域活看板 · 骨架页 v0.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f4f0e6;--card:#fbf8f1;--card-2:#efeadd;
  --ink:#2b2a27;--ink-2:#4b4842;--ink-3:#6b675e;
  --line:#c9c2b2;--line-soft:#ddd6c6;
  --g-subject:#5a6d7d;--g-task:#6a7d5a;--g-boundary:#7d5a6a;--g-model:#6b5a7d;
  --sig-ok:#4f8a63;--sig-warn:#a87f3d;--sig-risk:#a8544a;
  --gray:#8a8a83;--gray-tx:#6b675e;
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:Consolas,"Courier New",monospace;
}
html[data-skin="b"]{
  --paper:#14181d;--card:#1e242b;--card-2:#242b33;
  --ink:#e8eaed;--ink-2:#c6cbd1;--ink-3:#8e959d;
  --line:#3a4148;--line-soft:#2a3138;
  --g-subject:#7d94a8;--g-task:#8fa876;--g-boundary:#a87d8f;--g-model:#947da8;
  --sig-warn:#c9973f;--sig-risk:#c96a5a;
  --gray:#6b7178;--gray-tx:#8e959d;
}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans)}
body{font-size:13px;line-height:1.55;padding:0 0 44px}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
[hidden]{display:none !important}

.designbanner{font-size:11px;color:var(--ink-3);background:var(--card-2);
  border-bottom:1px solid var(--line-soft);padding:4px 20px;letter-spacing:.02em}

.topbar{display:flex;align-items:center;gap:18px;padding:11px 20px 9px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--paper)}
.brand{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.06em}
.brand small{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink-3);margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:2px}
.tab{padding:5px 14px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .sk{font-size:10px;color:var(--ink-3);margin-left:4px}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verchip{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border:1px solid var(--line-soft);border-radius:5px;padding:3px 8px;background:var(--card)}
.btn{border:1px solid var(--line);border-radius:5px;padding:4px 10px;font-size:12px;background:var(--card)}
.btn:hover{border-color:var(--ink-3)}

.wrap{padding:14px 20px 0}
.notice{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gray);
  border-radius:8px;padding:12px 16px;margin-bottom:14px}
.notice .nt{font-size:14px;font-weight:700;color:var(--gray-tx);font-family:var(--serif)}
.notice .nd{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.7}
.chip-gray{display:inline-block;font-size:11px;color:var(--gray-tx);background:var(--card-2);
  border:1px solid var(--line);border-radius:4px;padding:1px 9px;margin-right:6px}

.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.ovcard{background:var(--card);border:1px solid var(--line-soft);border-radius:8px;padding:10px 14px 11px}
.ovlabel{display:inline-block;font-size:11px;font-weight:600;color:var(--ink-2);
  background:var(--card-2);border:1px solid var(--line-soft);border-radius:4px;padding:1px 8px;margin-bottom:6px}
.ovsentence{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink)}
.ovsentence b{font-weight:700}
.anchip{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-top:7px;background:var(--paper)}
.anchip:hover{border-color:var(--ink-3)}
.anchip .n{color:var(--ink-3)}

.main{display:grid;grid-template-columns:1fr 338px;gap:14px;align-items:start}
.canvas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{min-width:0;overflow:hidden}
.colhead{display:flex;align-items:baseline;gap:7px;padding:2px 2px 7px;
  border-bottom:2px solid var(--line);margin-bottom:9px}
.coldot{width:9px;height:9px;border-radius:2px;align-self:center}
.colname{font-size:14px;font-weight:700;font-family:var(--serif);letter-spacing:.04em}
.colcount{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.colsub{font-size:11px;color:var(--ink-3);margin-left:auto}

.group{margin-bottom:10px}
summary.ghead{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);
  padding:4px 6px;background:var(--card-2);border:1px solid var(--line-soft);border-bottom:none;
  border-radius:5px 5px 0 0;list-style:none;cursor:pointer}
summary.ghead::-webkit-details-marker{display:none}
.ghead .gc{font-family:var(--mono);font-weight:400;color:var(--ink-3);font-size:11px}
.ghead .caret{margin-left:auto;color:var(--ink-3);font-size:10px}
details.group:not([open]) summary.ghead{border-bottom:1px solid var(--line-soft);border-radius:5px}
details.group:not([open]) .caret{transform:rotate(-90deg)}
.gbody{border:1px solid var(--line-soft);border-radius:0 0 5px 5px;padding:6px;background:var(--card)}

.node{border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:5px;
  background:var(--paper);padding:6px 8px 5px;margin-bottom:6px;width:100%;text-align:left;display:block;overflow:hidden}
.node:last-child{margin-bottom:0}
.node:hover{border-color:var(--ink-3);border-left-color:var(--ink-3)}
.node .nl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;line-height:1.4;
  white-space:normal;word-break:break-all}
.node .nm{display:flex;font-size:11px;color:var(--ink-3);margin-top:2px;gap:6px;align-items:center;flex-wrap:wrap}
.node .na{font-family:var(--mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line-soft);border-radius:3px;padding:0 4px}
.node.l-subject{border-left-color:var(--g-subject)}
.node.l-task{border-left-color:var(--g-task)}
.node.l-boundary{border-left-color:var(--g-boundary)}
.node.l-model{border-left-color:var(--g-model)}
.node.lit{outline:2px solid var(--ink);outline-offset:1px;background:var(--card)}
.node.gray{border-left-color:var(--gray);opacity:.6}
.node.dim{opacity:.32}
details.group.dim{opacity:.38}
button.anchip{cursor:pointer;text-align:left}
.focusstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:8px;
  padding:8px 12px;margin-bottom:12px;font-size:12px}
.focusstrip .ft{font-weight:700;font-family:var(--serif)}
.focusstrip .frow{border:1px solid var(--line-soft);border-radius:5px;padding:2px 8px;background:var(--paper);font-size:12px}
.focusstrip .frow:hover{border-color:var(--ink-3)}
.focusstrip .fh{color:var(--ink-3);font-size:11px}
.versionbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-left:4px solid var(--sig-warn);border-radius:8px;
  padding:7px 12px;margin-bottom:12px;font-size:12px;color:var(--ink-2)}
.versionbar .vb{font-family:var(--mono);font-size:11px}
.versionbar .vt{color:var(--ink-3);font-size:11px}
.diffbox .db{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:6px}
.diffbox .db.add{color:var(--sig-ok);border-color:var(--sig-ok)}
.diffbox .db.del{color:var(--sig-risk);border-color:var(--sig-risk)}
.diffbox .db.chg{color:var(--sig-warn);border-color:var(--sig-warn)}

.aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px}
.ptitle{font-size:13px;font-weight:700;font-family:var(--serif);letter-spacing:.03em;
  padding-bottom:7px;margin-bottom:8px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:8px}
.ptitle .tag{font-size:10px;font-weight:400;color:var(--ink-3);border:1px solid var(--line-soft);
  border-radius:4px;padding:0 6px;margin-left:auto}
.kv{font-size:12px;color:var(--ink-2);margin-bottom:5px;line-height:1.6;word-break:break-all}
.kv b{color:var(--ink-3);font-weight:600;margin-right:6px}
.relrow{font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line-soft);width:100%;text-align:left;display:block}
.relrow:last-child{border-bottom:none}
.relrow:hover{background:var(--card-2)}
.relrow .rt{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:3px;
  padding:0 5px;margin-right:6px;color:var(--ink-2)}
.hint{font-size:11px;color:var(--ink-3);line-height:1.7}
.raw{font-family:var(--mono);font-size:12px;line-height:1.75;color:var(--ink);
  background:var(--paper);border:1px solid var(--line-soft);border-radius:5px;
  padding:8px 10px;margin-top:6px;word-break:break-all;white-space:pre-wrap}
.slot{border:1.5px dashed var(--line);border-radius:8px;padding:12px 14px}
.slot .st{font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.slot .sd{font-size:11px;color:var(--ink-3);line-height:1.6}

.crumb{font-size:12px;color:var(--ink-3);padding:0 0 10px}
.crumb b{color:var(--ink-2);font-weight:600}
.workbench{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
.anchorlist{list-style:none}
.anchorlist li{border:1px solid var(--line-soft);border-radius:6px;padding:7px 10px;
  margin-bottom:7px;background:var(--paper);width:100%;text-align:left;display:block}
.anchorlist li.on{border-color:var(--ink-3);background:var(--card-2)}
.anchorlist .af{font-family:var(--mono);font-size:12px;color:var(--ink)}
.anchorlist .an{font-size:11px;color:var(--ink-3);margin-top:2px}
.rawpane{background:var(--card);border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;min-width:0}
.rawhead{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--line-soft);background:var(--card-2);flex-wrap:wrap}
.rawhead .rf{font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-all}
.rawhead .got{margin-left:auto;font-size:11px;color:var(--ink-2);border:1px solid var(--line);
  border-radius:4px;padding:1px 8px}
.rawbody{padding:14px 0;font-family:var(--mono);font-size:13px;line-height:1.9}
.rawline{display:flex;gap:14px;padding:0 14px}
.rawline .ln{color:var(--ink-3);min-width:34px;text-align:right;user-select:none}
.rawline .lt{color:var(--ink);word-break:break-all;white-space:pre-wrap}
.rawline.sel{background:var(--card-2);border-left:3px solid var(--sig-warn);padding-left:11px}
.rawnote{font-size:11px;color:var(--ink-3);padding:9px 14px;border-top:1px solid var(--line-soft)}
.emptybox{border:1.5px dashed var(--line);border-radius:8px;padding:18px 16px;color:var(--ink-3);font-size:12px}

.statusbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:16px;align-items:center;
  background:var(--card);border-top:1px solid var(--line);padding:6px 20px;
  font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.statusbar .mono{font-family:var(--mono)}
.statusbar .right{margin-left:auto}

@media (max-width:1100px){
  .main{grid-template-columns:1fr}
  .canvas{grid-template-columns:repeat(2,1fr)}
  .overview{grid-template-columns:1fr;gap:8px}
  .aside{flex-direction:row;flex-wrap:wrap}
  .aside .panel,.aside .slot{flex:1 1 260px}
  .workbench{grid-template-columns:1fr}
  .topright{margin-left:0}
}
@media (max-width:760px){
  .canvas{grid-template-columns:1fr}
  .wrap{padding:10px 12px 0}
  .topbar{padding:9px 12px}
}
</style>
</head>
<body>

<div class="designbanner">骨架页 v0.2（第二步）· 四列＋三视图＋概览句点锚回证据＋聚焦条 · 只读本地数据件、零联网、零第三方库 · 双击即开</div>

<div class="topbar">
  <div class="brand">关系场域<small>止观AI · 活看板</small></div>
  <div class="tabs" role="tablist" aria-label="视图预设">
    <button class="tab on" role="tab" aria-selected="true" data-view-btn="overview">总览</button>
    <button class="tab" role="tab" aria-selected="false" data-view-btn="duty">责任</button>
    <button class="tab" role="tab" aria-selected="false" data-view-btn="evidence">证据<span class="sk">B</span></button>
  </div>
  <div class="topright">
    <div class="verchip" id="verchip">版本 —</div>
    <button class="btn" id="autoBtn" type="button">自动 开</button>
    <button class="btn" id="reloadBtn" type="button">重新读盘</button>
  </div>
</div>

<div class="wrap">
  <div id="boot" class="notice">
    <div class="nt">正在读本地数据件…</div>
    <div class="nd" id="bootText">读 data/field-model.js（本地文件，不出网）。</div>
  </div>

  <div id="app" hidden>
    <div class="overview" id="overviewStrip"></div>
    <div id="focusStrip" class="focusstrip" hidden></div>
    <div id="versionbar" class="versionbar" hidden aria-live="polite"></div>
    <div id="diffBox" class="panel diffbox" hidden></div>

    <div class="main" id="mainWrap">
      <div class="canvas" id="canvas"></div>
      <aside class="aside" id="aside"></aside>
    </div>

    <div id="evidenceWrap" hidden>
      <div class="crumb" id="crumb"></div>
      <div class="workbench">
        <ul class="anchorlist" id="anchorList"></ul>
        <div class="rawpane" id="rawPane"></div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span class="mono" id="sbCounts">节点 — · 边 — · 锚 —</span>
  <span id="sbVersion">版本 —</span>
  <span id="sbTime">建模 —</span>
  <span id="sbSources">四源 —</span>
  <span id="sbRefresh">刷新 —</span>
  <span class="right">本地零网络 · 只读</span>
</div>

<script>
(function(){
  "use strict";

  var state = {
    model: null,
    view: "overview",
    selected: null,
    anchorIndex: 0,
    error: null,
    rendered: false,
    auto: true,
    lastVersion: null,
    lastGenerated: null,
    prevVersion: null,
    prevTime: null,
    lastCheck: null,
    lastHow: null,
    lastFail: null,
    diff: null,
    diffMeta: null
  };

  var WK_ORDER = ["W3", "W1", "W2", "W4"];
  var TASK_ORDER = ["进行中", "待办/待裁", "已完成/已交", "其他", "已销"];
  var BND_ORDER = [["window-boundary", "窗口职责"], ["ruling", "裁定边界"], ["task-boundary", "任务边界"]];
  var ARCH_ORDER = [["service", "服务"], ["module", "模块"], ["source-of-truth", "正源"],
    ["projection", "投影"], ["database", "数据库"], ["external-system", "外部系统"],
    ["risk", "风险"], ["actor", "角色"], ["", "未分类"]];

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // 脱敏只在渲染层做，不改生成器、不改数据件
  function safeLabel(s){
    return String(s == null ? "" : s).replace(/宗国法师/g, "法师"); // 脱敏替换目标（不渲染、不进图）：挡源文俗名于展示之外；勿当遗留错误删除。留改候法师一字
  }

  function attr(n, k){ return (n && n.attrs && n.attrs[k]) || ""; }

  // 渲染层统一出口：先脱敏再转义；数据件不改
  function T(s){ return esc(safeLabel(s)); }

  function anchorsOf(n){ return (n && n.anchors) || []; }

  function byId(id){
    if (!state.model) return null;
    for (var i = 0; i < state.model.nodes.length; i++){
      if (state.model.nodes[i].id === id) return state.model.nodes[i];
    }
    return null;
  }

  function firstAnchor(n, preferNoteWord){
    var as = anchorsOf(n);
    if (!as.length) return null;
    if (preferNoteWord){
      for (var i = 0; i < as.length; i++){
        if (String(as[i].note || "").indexOf(preferNoteWord) >= 0) return as[i];
      }
    }
    return as[0];
  }

  function fileUrl(a){
    if (!a || !state.model) return "#";
    var root = String(state.model.root || "").replace(/\\/g, "/").replace(/\/+$/, "");
    return "file:///" + encodeURI(root + "/" + String(a.file).replace(/\\/g, "/"));
  }

  /* ---------- 分组（确定性纯函数） ---------- */

  function groupByLayer(nodes, layer){
    var out = [];
    var map = {};
    function push(key, name, order){
      if (!map[key]){ map[key] = { key: key, name: name, order: order, nodes: [] }; out.push(map[key]); }
      return map[key];
    }
    var i, n;
    if (layer === "subject"){
      for (i = 0; i < nodes.length; i++){
        n = nodes[i];
        if (n.layer !== "subject") continue;
        if (n.kind === "human") push("human", "决策人", 90).nodes.push(n);
        else {
          var w = String(n.window || attr(n, "窗口") || "");
          var m = /^W\d$/.exec(w);
          if (m) push(m[0], m[0] + " 窗口", WK_ORDER.indexOf(m[0]) >= 0 ? WK_ORDER.indexOf(m[0]) : 50).nodes.push(n);
          else push("none", "未标窗口", 50).nodes.push(n);
        }
      }
      out.sort(function(a, b){ return a.order - b.order; });
      out.forEach(function(g){
        g.nodes.sort(function(a, b){
          var ka = a.kind === "human" ? 0 : (a.kind === "window" ? 1 : 2);
          var kb = b.kind === "human" ? 0 : (b.kind === "window" ? 1 : 2);
          if (ka !== kb) return ka - kb;
          var sa = String(attr(a, "AI 号") || a.label || "");
          var sb = String(attr(b, "AI 号") || b.label || "");
          return sa.localeCompare(sb, "zh");
        });
      });
    } else if (layer === "task"){
      for (i = 0; i < nodes.length; i++){
        n = nodes[i];
        if (n.layer !== "task") continue;
        var k = String(attr(n, "状态类") || "其他");
        var ord = TASK_ORDER.indexOf(k);
        push(k, k, ord >= 0 ? ord : 900).nodes.push(n);
      }
      out.sort(function(a, b){ return a.order - b.order; });
      out.forEach(function(g){
        g.nodes.sort(function(a, b){
          return String(attr(b, "任务号") || b.id).localeCompare(String(attr(a, "任务号") || a.id));
        });
      });
    } else if (layer === "boundary"){
      for (i = 0; i < nodes.length; i++){
        n = nodes[i];
        if (n.layer !== "boundary") continue;
        var found = null;
        for (var j = 0; j < BND_ORDER.length; j++) if (BND_ORDER[j][0] === n.kind) found = BND_ORDER[j];
        push(n.kind, found ? found[1] : (n.kind || "其他"), found ? j : 900).nodes.push(n);
      }
      out.sort(function(a, b){ return a.order - b.order; });
    } else {
      for (i = 0; i < nodes.length; i++){
        n = nodes[i];
        if (n.layer !== "model") continue;
        var t = (n.kind === "arch-hub") ? "service" : String(n.archType || "");
        var nm = "未分类", od = 900;
        if (n.kind === "arch-hub"){ nm = "服务（主轴）"; od = -1; }
        else for (var m2 = 0; m2 < ARCH_ORDER.length; m2++){
          if (ARCH_ORDER[m2][0] === t){ nm = ARCH_ORDER[m2][1]; od = m2; break; }
        }
        push(t || "none", nm, od).nodes.push(n);
      }
      out.sort(function(a, b){ return a.order - b.order; });
      out.forEach(function(g){
        g.nodes.sort(function(a, b){
          if (a.kind === "arch-hub") return -1;
          if (b.kind === "arch-hub") return 1;
          return safeLabel(a.label).localeCompare(safeLabel(b.label), "zh");
        });
      });
    }
    return out;
  }

  /* ---------- 渲染：四列 ---------- */

  var COLS = [
    { layer: "subject", name: "主体", color: "var(--g-subject)", sub: "谁" },
    { layer: "task", name: "任务", color: "var(--g-task)", sub: "做什么" },
    { layer: "boundary", name: "边界", color: "var(--g-boundary)", sub: "权限" },
    { layer: "model", name: "模型", color: "var(--g-model)", sub: "架构" }
  ];

  var neighborSet = null;

  function computeNeighbors(){
    neighborSet = null;
    if (!state.selected || !state.model) return;
    var s = {};
    s[state.selected] = 1;
    state.model.edges.forEach(function(e){
      if (e.from === state.selected) s[e.to] = 1;
      if (e.to === state.selected) s[e.from] = 1;
    });
    neighborSet = s;
  }

  function isDim(n){ return !!neighborSet && !neighborSet[n.id]; }

  function groupDim(g){
    if (!neighborSet) return false;
    for (var i = 0; i < g.nodes.length; i++) if (neighborSet[g.nodes[i].id]) return false;
    return true;
  }

  function metaChips(n){
    var chips = [];
    if (n.layer === "subject"){
      if (n.kind === "human") chips.push("唯一决策人");
      else if (n.kind === "window") chips.push("窗口");
      else chips.push(String(n.window || attr(n, "窗口") || "—"));
    } else if (n.layer === "task"){
      var ws = (n.windows || []).filter(function(x){ return x && x !== "—"; });
      chips.push(String(attr(n, "状态类") || "其他"));
      chips.push("责任 " + (ws.length ? ws.join("/") : "未标"));
    } else if (n.layer === "boundary"){
      for (var i = 0; i < BND_ORDER.length; i++) if (BND_ORDER[i][0] === n.kind) chips.push(BND_ORDER[i][1]);
      if (!chips.length) chips.push(String(n.kind || "—"));
    } else {
      chips.push(n.kind === "arch-hub" ? "主轴" : String(n.archType || "未分类"));
    }
    chips.push("锚 " + anchorsOf(n).length);
    return chips.map(function(c){ return '<span>' + T(c) + '</span>'; }).join("");
  }

  function renderColumns(){
    var html = "";
    COLS.forEach(function(col){
      var groups = groupByLayer(state.model.nodes, col.layer);
      var total = groups.reduce(function(s, g){ return s + g.nodes.length; }, 0);
      html += '<div class="col">'
        + '<div class="colhead"><span class="coldot" style="background:' + col.color + '"></span>'
        + '<span class="colname">' + col.name + '</span>'
        + '<span class="colcount">' + total + '</span>'
        + '<span class="colsub">' + col.sub + '</span></div>';
      groups.forEach(function(g){
        html += '<details class="group' + (groupDim(g) ? " dim" : "") + '" open data-gkey="' + esc(col.layer + ":" + g.key) + '">'
          + '<summary class="ghead">' + esc(g.name)
          + '<span class="gc">' + g.nodes.length + '</span><span class="caret">▾</span></summary>'
          + '<div class="gbody">';
        g.nodes.forEach(function(n){
          var lb = safeLabel(n.label);
          html += '<button type="button" class="node l-' + esc(n.layer)
            + (state.selected === n.id ? ' lit' : '')
            + (isDim(n) ? ' dim' : '')
            + '" data-node="' + esc(n.id) + '" title="' + esc(lb) + '">'
            + '<span class="nl">' + esc(lb) + '</span>'
            + '<span class="nm">' + metaChips(n) + '</span>'
            + '</button>';
        });
        html += '</div></details>';
      });
      html += '</div>';
    });
    document.getElementById("canvas").innerHTML = html;
  }

  /* ---------- 渲染：概览三句（现算，不写死） ---------- */

  function anchorIndexFor(n, a){
    if (!n || !a) return 0;
    var as = anchorsOf(n);
    for (var i = 0; i < as.length; i++) if (as[i] === a) return i;
    return 0;
  }

  function anchorChip(a, tail, node){
    if (!a) return '<span class="anchip" style="color:var(--gray-tx)">锚 <span class="n">未取到</span></span>';
    var openTag = node
      ? '<button type="button" class="anchip" data-node="' + esc(node.id) + '" data-anchor="' + anchorIndexFor(node, a) + '"'
      : '<span class="anchip"';
    var closeTag = node ? "</button>" : "</span>";
    return openTag + ' title="' + T(a.raw || a.fp || "") + '">'
      + T(a.file) + ':' + a.line + '<span class="n">' + T(tail || "") + "</span>" + closeTag;
  }

  function renderOverview(){
    var m = state.model, st = m.stats || {};
    var tasks = m.nodes.filter(function(n){ return n.layer === "task"; });
    var moving = tasks.filter(function(n){ return String(attr(n, "状态类") || "") === "进行中"; });
    var rows = Number(st.rulingRows || 0), decided = Number(st.rulingDecided || 0);
    var open = Math.max(0, rows - decided);
    var human = m.nodes.filter(function(n){ return n.kind === "human"; })[0] || null;

    var movingNames = moving.slice(0, 2).map(function(n){ return safeLabel(n.label); });
    var s1 = moving.length
      ? ('<b>' + moving.length + '</b> 条任务在动：' + esc(movingNames.join('、')) + (moving.length > 2 ? ' 等' : ''))
      : '当前没有「进行中」类任务。';

    var s2 = '待裁单共 <b>' + rows + '</b> 行，已决 <b>' + decided + '</b>，未决 <b>' + open + '</b>（未决＝行数减已决）。';

    var s3 = human
      ? ('下一步看 <b>' + esc(safeLabel(human.label)) + '</b>：候裁 <b>' + open + '</b> 项候法师一字。')
      : '下一步看谁：<span style="color:var(--gray-tx)">未取到决策人节点</span>。';

    var rulingNode = m.nodes.filter(function(n){ return n.kind === "ruling"; })[0] || null;

    document.getElementById("overviewStrip").innerHTML =
      '<div class="ovcard"><span class="ovlabel">今天哪条线在动</span>'
        + '<div class="ovsentence">' + s1 + '</div>'
        + anchorChip(moving.length ? firstAnchor(moving[0], "状态") : null, " · 状态", moving[0]) + '</div>'
      + '<div class="ovcard"><span class="ovlabel">哪里卡住</span>'
        + '<div class="ovsentence">' + s2 + '</div>'
        + anchorChip(rulingNode ? firstAnchor(rulingNode) : null, " · 待裁单", rulingNode) + '</div>'
      + '<div class="ovcard"><span class="ovlabel">下一步看谁</span>'
        + '<div class="ovsentence">' + s3 + '</div>'
        + anchorChip(human ? firstAnchor(human) : null, " · 人类身份", human) + '</div>';
  }

  /* ---------- 渲染：右栏 ---------- */

  function renderAside(){
    var el = document.getElementById("aside");
    var n = state.selected ? byId(state.selected) : null;

    if (state.view === "duty"){
      var edges = state.model.edges.filter(function(e){ return e.type === "责任"; });
      var rows = edges.map(function(e){
        var from = byId(e.from), to = byId(e.to);
        var fl = from ? safeLabel(from.label) : e.from;
        var tl = to ? safeLabel(to.label) : e.to;
        return '<button type="button" class="relrow" data-node="' + esc(e.from) + '">'
          + '<span class="rt">责任</span>' + T(fl) + ' → ' + T(tl)
          + '<br><span class="hint">锚 ' + anchorsOf(e).length + ' 枚' + (e.desc ? ' · ' + T(e.desc) : '') + '</span></button>';
      }).join("");
      el.innerHTML = '<div class="panel"><div class="ptitle">责任归属<span class="tag">'
        + edges.length + ' 条责任边 · 现算</span></div>'
        + (rows || '<div class="hint">未取到责任边。</div>')
        + '</div>'
        + '<div class="panel"><div class="ptitle">说明</div><div class="hint">'
        + '本视图先列责任边（任务→承担窗）。骨架态只做这一层；后续再加责任高亮与按窗归组。</div></div>';
      return;
    }

    if (!n){
      el.innerHTML = '<div class="panel"><div class="ptitle">节点卡<span class="tag">未选</span></div>'
        + '<div class="hint">点左列任一节点，这里显示它的身份、属性与锚；点锚切证据视图看原文。</div></div>'
        + '<div class="panel"><div class="ptitle">骨架态说明<span class="tag">第一步</span></div>'
        + '<div class="hint">本页只做四件事：双击能开、读现有数据、固定四列、三视图可切。'
        + '搜索、折叠记忆、变化明细、跨会话书签、锚体检面板均未上，按步再长。</div></div>';
      return;
    }

    var attrs = n.attrs || {};
    var kvHtml = "";
    Object.keys(attrs).slice(0, 8).forEach(function(k){
      var v = String(attrs[k] == null ? "" : attrs[k]);
      kvHtml += '<div class="kv"><b>' + esc(k) + '</b>' + T(v.length > 120 ? v.slice(0, 120) + '…' : v) + '</div>';
    });

    var as = anchorsOf(n);
    var anchorHtml = as.length ? as.map(function(a, i){
      return '<button type="button" class="relrow" data-anchor="' + i + '">'
        + '<span class="rt">锚</span><span class="mono" style="font-family:var(--mono)">'
        + T(a.file) + ':' + a.line + '</span>'
        + '<br><span class="hint">' + T(a.note || "（无注）") + '</span></button>';
    }).join("") : '<div class="hint" style="color:var(--gray-tx)">锚 未取到</div>';

    el.innerHTML = '<div class="panel"><div class="ptitle">节点卡<span class="tag">' + esc(n.layer) + ' · ' + esc(n.kind) + '</span></div>'
      + '<div class="kv"><b>名称</b>' + esc(safeLabel(n.label)) + '</div>'
      + (n.desc ? '<div class="kv"><b>说明</b>' + esc(safeLabel(n.desc)) + '</div>' : '')
      + kvHtml
      + '</div>'
      + '<div class="panel"><div class="ptitle">锚<span class="tag">共 ' + as.length + ' 枚 · 建模时快照</span></div>'
      + anchorHtml
      + '<div class="hint" style="margin-top:8px">点一枚锚 → 证据视图看原文；原文为建模时抓的前若干字，不实时回读。</div></div>';
  }

  /* ---------- 渲染：证据工作台 ---------- */

  function renderEvidence(){
    var n = state.selected ? byId(state.selected) : null;
    var listEl = document.getElementById("anchorList");
    var paneEl = document.getElementById("rawPane");
    var crumbEl = document.getElementById("crumb");

    if (!n){
      crumbEl.innerHTML = '<b>证据</b> · 未选节点';
      listEl.innerHTML = '<li><div class="af">未取到</div><div class="an">先回总览点一个节点</div></li>';
      paneEl.innerHTML = '<div class="rawhead"><span class="rf">—</span><span class="got">未取到</span></div>'
        + '<div class="rawnote">证据视图按节点取锚。先在总览（或责任）视图点一个节点，再切回这里。</div>';
      return;
    }

    var as = anchorsOf(n);
    crumbEl.innerHTML = '总览 / 节点 / <b>' + esc(safeLabel(n.label)) + '</b> / 证据 · 锚 ' + as.length;

    if (!as.length){
      listEl.innerHTML = '<li><div class="af">锚 未取到</div><div class="an">该节点无锚</div></li>';
      paneEl.innerHTML = '<div class="rawhead"><span class="rf">—</span><span class="got">未取到</span></div>'
        + '<div class="rawnote">取不到＝灰＋文字「未取到」，不显示绿、不装作有数据。</div>';
      return;
    }

    if (state.anchorIndex >= as.length) state.anchorIndex = 0;

    listEl.innerHTML = as.map(function(a, i){
      return '<li' + (i === state.anchorIndex ? ' class="on"' : '') + '>'
        + '<button type="button" data-anchor="' + i + '" style="text-align:left;width:100%">'
        + '<div class="af">' + T(a.file) + ':' + a.line + '</div>'
        + '<div class="an">' + T(a.note || "（无注）") + '</div></button></li>';
    }).join("");

    var a = as[state.anchorIndex];
    var rawLines = String(a.raw || "").split("\n");
    var body = rawLines.map(function(ln, i){
      return '<div class="rawline' + (i === 0 ? ' sel' : '') + '">'
        + '<span class="ln">' + (a.line + i) + '</span>'
        + '<span class="lt">' + T(ln) + '</span></div>';
    }).join("");

    paneEl.innerHTML = '<div class="rawhead"><span class="rf">' + T(a.file) + '</span>'
      + '<span class="got">原文已取到 · 建模时快照</span></div>'
      + '<div class="rawbody">' + body + '</div>'
      + '<div class="rawnote">只显示锚行本身（原文前 ' + (a.rawLen || String(a.raw || "").length) + ' 字）；'
      + '附近非锚行未展开。原文里的俗名按渲染层规则显示为「法师」，数据件不改。'
      + '真值闸＝锚校验探针，页面只展示建模时锚。'
      + ' <a href="' + esc(fileUrl(a)) + '" target="_blank" rel="noopener">打开该文件</a></div>';
  }

  /* ---------- 渲染：聚焦条 ---------- */

  function renderFocus(){
    var el = document.getElementById("focusStrip");
    var n = state.selected ? byId(state.selected) : null;
    if (!n || !state.model || state.view === "evidence"){ el.hidden = true; el.innerHTML = ""; return; }
    var edges = state.model.edges.filter(function(e){ return e.from === n.id || e.to === n.id; });
    var rows = edges.map(function(e){
      var otherId = e.from === n.id ? e.to : e.from;
      var o = byId(otherId);
      return '<button type="button" class="frow" data-node="' + esc(otherId) + '">'
        + (e.from === n.id ? "→ " : "← ") + T(e.type) + " " + T(o ? o.label : otherId)
        + '<span class="fh"> 锚 ' + anchorsOf(e).length + "</span></button>";
    }).join("");
    el.hidden = false;
    el.innerHTML = '<span class="ft">聚焦：' + T(n.label) + "</span>"
      + (rows || '<span class="fh">该节点无边</span>')
      + '<span class="fh">点空白处解除聚焦 · 非邻域淡出但不隐藏</span>';
  }

  /* ---------- 视图切换 ---------- */

  function setView(v){
    state.view = v;
    document.documentElement.setAttribute("data-view", v);
    document.documentElement.setAttribute("data-skin", v === "evidence" ? "b" : "a");

    var btns = document.querySelectorAll("[data-view-btn]");
    for (var i = 0; i < btns.length; i++){
      var on = btns[i].getAttribute("data-view-btn") === v;
      btns[i].className = "tab" + (on ? " on" : "");
      btns[i].setAttribute("aria-selected", on ? "true" : "false");
    }

    document.getElementById("overviewStrip").hidden = (v === "evidence");
    document.getElementById("mainWrap").hidden = (v === "evidence");
    document.getElementById("evidenceWrap").hidden = (v !== "evidence");

    if (v === "evidence") renderEvidence();
    else renderAside();
    renderFocus();
    syncDiffVisibility();
  }

  /* ---------- 事件 ---------- */

  function selectNode(id, opts){
    state.selected = id;
    state.anchorIndex = 0;
    computeNeighbors();
    renderColumns();
    renderFocus();
    if (state.view === "evidence") renderEvidence();
    else renderAside();
    if (opts && opts.gotoEvidence) setView("evidence");
  }

  function clearSelection(){
    state.selected = null;
    state.anchorIndex = 0;
    computeNeighbors();
    renderColumns();
    renderFocus();
    if (state.view === "evidence") renderEvidence();
    else renderAside();
  }

  document.addEventListener("click", function(ev){
    var t = ev.target;
    if (t && t.closest) t = t.closest("[data-node],[data-view-btn],[data-anchor]");
    if (!t){
      var act = ev.target && ev.target.closest ? ev.target.closest("button,a,summary,input") : null;
      if (!act) clearSelection();
      return;
    }

    var viewBtn = t.getAttribute("data-view-btn");
    if (viewBtn){ setView(viewBtn); return; }

    var nodeId = t.getAttribute("data-node");
    var ai = t.getAttribute("data-anchor");
    if (nodeId && ai != null){
      state.selected = nodeId;
      state.anchorIndex = parseInt(ai, 10) || 0;
      computeNeighbors();
      renderColumns();
      setView("evidence");
      return;
    }
    if (nodeId){ selectNode(nodeId); return; }
    if (ai != null){
      state.anchorIndex = parseInt(ai, 10) || 0;
      if (state.view === "evidence") renderEvidence();
      else setView("evidence");
      return;
    }
  });

  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape") clearSelection();
  });

  /* ---------- 读盘 ---------- */

  function bootMsg(title, text){
    var boot = document.getElementById("boot");
    boot.hidden = false;
    boot.className = "notice";
    boot.innerHTML = '<div class="nt">' + esc(title) + '</div>'
      + '<div class="nd">' + text + '</div>';
  }

  function nowStr(){
    var d = new Date();
    function p(x){ return (x < 10 ? "0" : "") + x; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function loadModel(opts){
    var silent = !!(opts && opts.silent);
    if (!silent) bootMsg("正在读本地数据件…", "读 data/field-model.js（本地文件，不出网）。");

    var old = document.getElementById("modelScript");
    if (old) old.parentNode.removeChild(old);
    window.FIELD_MODEL = null;

    var s = document.createElement("script");
    s.id = "modelScript";
    s.src = "data/field-model.js?v=" + Date.now();
    s.onload = function(){
      if (!window.FIELD_MODEL){ enterEmpty("nofield", null, silent); return; }
      var m = window.FIELD_MODEL;
      if (!m.nodes || !m.nodes.length){ enterEmpty("nonodes", m, silent); return; }
      var wasError = !!state.error;
      var changed = !!state.lastVersion && m.version !== state.lastVersion;
      if (changed){
        state.prevVersion = state.lastVersion;
        state.prevTime = state.lastGenerated;
        state.diff = state.model ? computeDiff(state.model, m) : null;
        state.diffMeta = { at: nowStr(), how: silent ? "自动" : "手动" };
      }
      state.model = m;
      state.error = null;
      state.lastFail = null;
      state.lastVersion = m.version;
      state.lastGenerated = m.generatedAtLocal || null;
      state.lastCheck = nowStr();
      state.lastHow = silent ? "自动" : "手动";
      document.getElementById("boot").hidden = true;
      document.getElementById("app").hidden = false;
      if (changed || !state.rendered || wasError){ state.rendered = true; renderAll(); }
      renderVersionBar(changed);
      renderDiffList();
      renderRefreshNote();
    };
    s.onerror = function(){ enterEmpty("missing", null, silent); };
    document.body.appendChild(s);
  }

  function stable(o){
    return JSON.stringify(o == null ? {} : o, Object.keys(o == null ? {} : o).sort());
  }

  function fpNode(n){
    return [n.label, n.desc, n.status, stable(n.attrs), stable(n.anchors)].join("|");
  }

  function fpEdge(e){
    return [e.from, e.to, e.type, e.desc, stable(e.anchors)].join("|");
  }

  function changedFields(a, b){
    var f = [];
    if (a.label !== b.label) f.push("名称");
    if (a.desc !== b.desc) f.push("说明");
    if (a.status !== b.status) f.push("状态");
    if (stable(a.attrs) !== stable(b.attrs)) f.push("属性");
    if (stable(a.anchors) !== stable(b.anchors)) f.push("锚");
    return f;
  }

  function computeDiff(oldM, newM){
    var d = { added: [], removed: [], changed: [], edges: { added: [], removed: [], changed: [] } };
    var om = {}, nm = {}, oe = {}, ne = {};
    oldM.nodes.forEach(function(n){ om[n.id] = n; });
    newM.nodes.forEach(function(n){ nm[n.id] = n; });
    oldM.edges.forEach(function(e){ oe[e.id] = e; });
    newM.edges.forEach(function(e){ ne[e.id] = e; });
    newM.nodes.forEach(function(n){ if (!om[n.id]) d.added.push(n); });
    oldM.nodes.forEach(function(n){ if (!nm[n.id]) d.removed.push(n); });
    newM.nodes.forEach(function(n){
      if (om[n.id] && fpNode(om[n.id]) !== fpNode(n)) d.changed.push({ n: n, fields: changedFields(om[n.id], n) });
    });
    newM.edges.forEach(function(e){ if (!oe[e.id]) d.edges.added.push(e); });
    oldM.edges.forEach(function(e){ if (!ne[e.id]) d.edges.removed.push(e); });
    newM.edges.forEach(function(e){
      if (oe[e.id] && fpEdge(oe[e.id]) !== fpEdge(e)) d.edges.changed.push(e);
    });
    return d;
  }

  function diffCount(d){
    if (!d) return 0;
    return d.added.length + d.removed.length + d.changed.length
      + d.edges.added.length + d.edges.removed.length + d.edges.changed.length;
  }

  function diffRow(cls, tag, label, id, node, extra){
    var click = node && anchorsOf(node).length ? ' data-node="' + esc(id) + '" data-anchor="0"' : '';
    var openTag = click ? '<button type="button" class="relrow"' + click + '>' : '<div class="relrow" style="cursor:default">';
    var closeTag = click ? "</button>" : "</div>";
    return openTag + '<span class="db ' + cls + '">' + tag + "</span>" + T(label)
      + '<br><span class="hint">' + esc(id) + (extra ? " · " + T(extra) : "") + "</span>" + closeTag;
  }

  function edgeRow(cls, tag, e){
    var f = byId(e.from), t2 = byId(e.to);
    return '<div class="relrow" style="cursor:default"><span class="db ' + cls + '">' + tag + "</span>边 "
      + T(e.type) + "：" + T(f ? f.label : e.from) + " → " + T(t2 ? t2.label : e.to)
      + '<br><span class="hint">' + esc(e.id) + "</span></div>";
  }

  function syncDiffVisibility(){
    var el = document.getElementById("diffBox");
    el.hidden = (state.view === "evidence") || !state.diff;
  }

  function renderDiffList(){
    var el = document.getElementById("diffBox");
    var d = state.diff;
    if (!d){ el.hidden = true; el.innerHTML = ""; return; }
    var rows = "";
    d.added.forEach(function(n){ rows += diffRow("add", "新增", n.label, n.id, n, ""); });
    d.changed.forEach(function(c){ rows += diffRow("chg", "变更", c.n.label, c.n.id, c.n, "变了：" + c.fields.join("、")); });
    d.removed.forEach(function(n){ rows += diffRow("del", "移除", n.label, n.id, null, ""); });
    d.edges.added.forEach(function(e){ rows += edgeRow("add", "新增", e); });
    d.edges.changed.forEach(function(e){ rows += edgeRow("chg", "变更", e); });
    d.edges.removed.forEach(function(e){ rows += edgeRow("del", "移除", e); });
    el.innerHTML = '<div class="ptitle">变化明细<span class="tag">' + diffCount(d) + ' 项 · 内存比对 · 关页即失</span></div>'
      + '<div class="hint" style="margin-bottom:6px">' + esc(state.prevVersion || "—") + " → " + esc(state.lastVersion || "—")
      + " · " + esc((state.diffMeta && state.diffMeta.at) || "") + " · " + esc((state.diffMeta && state.diffMeta.how) || "") + '刷新</div>'
      + (rows || '<div class="hint">版本变但逐条比对无差异（仅顺序或未跟踪字段变动）。</div>');
    syncDiffVisibility();
  }

  function renderVersionBar(changed){
    var el = document.getElementById("versionbar");
    if (!changed) return;
    el.hidden = false;
    el.innerHTML = '<span>版本已变</span><span class="vb">' + esc(state.prevVersion || "—") + '</span>'
      + '<span>→</span><span class="vb">' + esc(state.lastVersion || "—") + '</span>'
      + '<span class="vt">' + esc(state.prevTime || "旧时刻未记") + ' → ' + esc(state.lastGenerated || "—") + '</span>'
      + '<span class="vt">· ' + esc(state.lastHow || "") + '刷新 · 明细 ' + diffCount(state.diff) + ' 项见下</span>';
  }

  function renderRefreshNote(){
    var el = document.getElementById("sbRefresh");
    if (!el) return;
    el.textContent = "刷新 " + (state.auto ? "自动·2s" : "手动") + "｜最近 " + (state.lastCheck || "—")
      + (state.lastFail ? "｜读取失败" : "");
  }

  function enterEmpty(kind, m, silent){
    state.model = null;
    state.error = kind;
    state.lastVersion = null;
    state.lastGenerated = null;
    state.lastCheck = nowStr();
    state.lastFail = kind;
    state.lastHow = silent ? "自动" : "手动";
    state.diff = null;
    document.getElementById("boot").hidden = true;
    document.getElementById("app").hidden = false;
    document.getElementById("overviewStrip").hidden = true;
    document.getElementById("mainWrap").hidden = false;
    document.getElementById("evidenceWrap").hidden = true;
    document.getElementById("focusStrip").hidden = true;
    document.getElementById("versionbar").hidden = true;
    document.getElementById("diffBox").hidden = true;
    renderEmptySkeleton(kind, m);
    document.getElementById("verchip").textContent = "版本 —";
    document.getElementById("sbCounts").textContent = "节点 — · 边 — · 锚 —（未取到 ≠ 真零）";
    document.getElementById("sbVersion").textContent = "版本 —";
    document.getElementById("sbTime").textContent = "建模 —";
    document.getElementById("sbSources").textContent = (m && m.sources && m.sources.length) ? "四源 逐源见右栏" : "四源 —";
    renderRefreshNote();
  }

  function renderEmptySkeleton(kind, m){
    var titles = {
      missing: "数据件没读到（文件不存在或读失败）",
      nofield: "数据件读到了，但里面没有模型",
      nonodes: "数据件读到了，但节点为空"
    };
    var cols = "";
    COLS.forEach(function(c){
      cols += '<div class="col"><div class="colhead"><span class="coldot" style="background:var(--gray)"></span>'
        + '<span class="colname">' + c.name + '</span><span class="colcount">—</span>'
        + '<span class="colsub">' + c.sub + '</span></div>'
        + '<div class="node gray"><span class="nl" style="color:var(--gray-tx)">未取到</span></div></div>';
    });
    document.getElementById("canvas").innerHTML = cols;
    var chips = "";
    if (m && m.sources && m.sources.length){
      chips = m.sources.map(function(s){ return '<span class="chip-gray">' + T(s.label || s.key) + ' 未取到</span>'; }).join("");
    } else {
      chips = '<span class="chip-gray">数据件本身未取到 · 源清单无从逐源报</span>';
    }
    document.getElementById("aside").innerHTML =
      '<div class="notice"><div class="nt">' + titles[kind] + '</div>'
      + '<div class="nd">读的是本地文件 data/field-model.js，不出网。读不到≠真零，也不拿旧数据充数。<br>' + chips + '</div></div>'
      + '<div class="panel"><div class="ptitle">怎么办<span class="tag">空态</span></div>'
      + '<div class="hint">若还没生成过数据：在看板目录跑一次生成器；若生成过：点右上「重新读盘」。数据回来后本页自动或手动恢复，不用重载整页。</div></div>';
  }

  function applyHash(){
    var h = String(location.hash || "").replace(/^#/, "");
    var parts = {};
    h.split("&").forEach(function(p){
      var kv = p.split("=");
      if (kv[0]) parts[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || "");
    });
    if (parts.node && byId(parts.node)) state.selected = parts.node;
    if (parts.anchor != null && parts.anchor !== "") state.anchorIndex = parseInt(parts.anchor, 10) || 0;
    if (parts.view === "overview" || parts.view === "duty" || parts.view === "evidence") state.view = parts.view;
    return parts;
  }

  function renderAll(){
    var m = state.model, st = m.stats || {};
    var src = m.sources || [];

    applyHash();
    computeNeighbors();

    document.getElementById("verchip").textContent = "v " + (m.version || "—");
    renderOverview();
    renderColumns();
    setView(state.view);

    document.getElementById("sbCounts").textContent =
      (st.nodes || 0) + " 节点 · " + (st.edges || 0) + " 边 · " + (st.anchors || 0) + " 锚";
    document.getElementById("sbVersion").textContent = "版本 " + (m.version || "—");
    document.getElementById("sbTime").textContent = "建模 " + (m.generatedAtLocal || "—");
    document.getElementById("sbSources").textContent = src.length
      ? ("四源 " + src.map(function(x){ return (x.label || x.key) + " " + (x.lines || "—") + " 行"; }).join(" · "))
      : "四源 —";
    renderRefreshNote();
    renderDiffList();
  }

  document.getElementById("reloadBtn").addEventListener("click", function(){ loadModel(); });

  document.getElementById("autoBtn").addEventListener("click", function(){
    state.auto = !state.auto;
    this.textContent = "自动 " + (state.auto ? "开" : "关");
    renderRefreshNote();
  });

  setInterval(function(){
    if (state.auto) loadModel({ silent: true });
  }, 2000);

  window.addEventListener("hashchange", function(){
    if (!state.model) return;
    applyHash();
    computeNeighbors();
    renderColumns();
    setView(state.view);
  });

  loadModel();
})();
</script>
</body>
</html>
