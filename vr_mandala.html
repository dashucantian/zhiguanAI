<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════════════════════════
   止观 · 曼荼罗场域（独立场景，2026-09-16 S1）
   ────────────────────────────────────────────────────────────────
   缘起：法师 09-15 裁定借鉴《The Journey》（云中工作室）之形式/结构/
   要素/风格，但以止观禅修为根本做独立场域——「与现有 VR 场景风格完全
   不同，不要混合在一起」。规划见 01_项目管理\20260916_曼荼罗场域战略
   规划_v0.3.md（GPT 评审 8.5/10 全量吸收）。

   S1 目标（唯一）：验证【道场感】——摘下头显说"我刚才进入了一个地方"，
   而非"我用了一个软件"。
   S1 纪律（v0.3 §六）：
     · 只做黑底＋金线曼荼罗＋三层纵深
     · 不要粒子、不要脑电、不要 AI、不要 bloom
     · 完全静态（空间呼吸是 S2 的事；心率原则：每加一个元素先问
       让人更安静还是更兴奋）
     · 纯前端独立页面：不依赖 console_server 数据流（S6 才接）
   借形式不借内容：金线语法/中心辐射构图学自 The Journey 之形式取证
   （其站 THREE/WebGL 零次、全预渲染视频——我们用程序化实时生成达成
   同等连贯，借语法不借实现）；曼荼罗图像全部程序化绘制，不使用其素材。

   色板（v0.1 §一 CSS 频次取证）：
     黑底 #000000/#0d0e06 · 金叶 #d4af5a/#e3cb76 · 暖金 #f0d2b4
     赭红点缀 #ba7c69（S1 不用，留待后续章节）
   ════════════════════════════════════════════════════════════════ */

const PALETTE = {
  black:   0x000000,
  goldFar: 0x6b5630,   // 外环：暗金（大气透视，退远）
  goldMid: 0xd4af5a,   // 中环：主金叶
  goldNear:0xf0d2b4,   // 内环：暖金亮（近身）
  center:  0xe3cb76,   // 中心光点
};

/* ── 构图变体注册表（09-16 法师需求："更多版本不同设计效果比较"）────
   所有变体共用同一批生成器（rosePoints/ringPoints/spokePoints）与同一
   色板，差别只在构图参数——"换设计＝换参数"是这套程序化方法的本性，
   也正因此，任何一个变体条目本身就是一份可交付给本地模型/他人的
   「任务书」：照 JSON 描述新构图 → 无头验收 → 截图对比，流程不变。
   · s1        已收口基准（三层纵深：近身/主坛/大地）＝默认
   · v2-abyss  大地深渊：大地坛城升为主角（巨大而亮），主坛退远退小——
               "立于大坛之沿，远望金殿"
   · v3-immersion 单坛沉浸：一具近前大十六叶坛＋浓雾收尽周边——
               视野极减，注意力无处可去
   · v4-lotuspond 莲池观（09-19 Qwen3.6 设计＋W1 整合）：立于莲池之畔，
               水面浮金——浅雾通透、大地暖金占比高，与 v2abyss 的深渊压迫对比
   · v5-stupa   塔影仰观（同上）：仰观巨塔、金线自天而降——近距浓雾大坛，
               敬畏与崇高（几何语义修订中，见注册表内审查记录）
   · v6-void    虚空（同上）：天地之间只剩自己与一点光——极小主坛＋极浓雾＋
               远相机，空旷孤独（ground op=0.25 系法师批准特例）
   S1 纪律对所有变体同等生效：静态、无粒子、无 bloom、无数据流。 */
const VARIANTS = {
  s1: {
    label: 'S1 基准 · 三层纵深',
    cam: [0, 1.6, 3.2], fog: 0.022,
    inner:  {k:4, r:0.55, seg:720,  rings:[0.62,0.30],                color:'goldNear', op:0.85, pos:[0,1.15,-1.3]},
    middle: {k:8, r:2.6,  seg:1440, rings:[2.8,1.9,0.9], spokes:[2.8,3.35,32], color:'goldMid', op:0.80, pos:[0,2.1,-6]},
    ground: {k:4, r:9.0,  seg:1440, rings:[9.6,5.2],                   color:'goldFar',  op:0.55, y:0.02},  /* 2026-09-19 法师裁定 A1 甲：大地层十六瓣→八瓣（k=8→4） */
    orb: {r:0.045, color:'center', glow:0.9, followInner:true},
  },
  v2abyss: {
    label: 'V2 · 大地深渊',
    cam: [0, 1.6, 2.0], fog: 0.030,
    inner:  null,
    middle: {k:8, r:2.2,  seg:1440, rings:[2.4,1.5,0.7], spokes:[2.4,2.9,24], color:'goldMid', op:0.60, pos:[0,1.7,-11]},
    ground: {k:4, r:13.0, seg:2160, rings:[14.0,7.2,4.0], spokes:[14.0,15.6,48], color:'goldNear', op:0.80, y:0.02},  /* 2026-09-19 裁定 A1 甲同源：大地层 k=8→4 */
    orb: {r:0.05, color:'center', glow:1.1, pos:[0,1.45,-2.6]},
  },
  v3immersion: {
    label: 'V3 · 单坛沉浸',
    cam: [0, 1.6, 2.6], fog: 0.055,
    inner:  null,
    middle: {k:8, r:3.1, seg:1440, rings:[3.4,2.3,1.2], spokes:[3.4,3.9,40], color:'goldMid', op:0.92, pos:[0,1.7,-3.4]},
    ground: {k:4, r:6.0, seg:720,  rings:[6.6],                          color:'goldFar',  op:0.35, y:0.02},
    orb: {r:0.06, color:'center', glow:1.3, pos:[0,1.7,-3.4]},
  },
  v4lotuspond: {
    label: 'V4 · 莲池观',
    cam: [0, 1.6, 2.5], fog: 0.025,
    inner:  {k:4, r:0.55, seg:720,  rings:[0.62,0.30],                color:'goldNear', op:0.85, pos:[0,1.15,-1.3]},
    middle: {k:8, r:2.4,  seg:1440, rings:[2.6,1.7,0.8], spokes:[2.6,3.1,28], color:'goldFar', op:0.55, pos:[0,1.8,-9]},
    ground: {k:4, r:11.0, seg:1440, rings:[12.0,6.0], spokes:[12.0,13.5,36], color:'goldNear', op:0.70, y:0.02},
    orb: {r:0.055, color:'center', glow:1.0, followInner:true},
    /* 〔W1 审查 09-19〕设计师自标"金色 ~1.0%"与"大地暖金占比高"存在张力：大地环
       r=12~13.5 是画面最大结构、加色混合亮金，实际占比很可能远超 1.0%。W1 不代改
       配色（美学归设计师＋法师 Pico 终审），问题已回派设计师复核。 */
  },
  /* 〔2026-09-30 法师裁定·留档标注〕v5stupa 不下线不删：闸门金色占比 0.22% FAIL
     （09-19 裁丙留档）＋ Pico 真机体感「更兴奋」（约 2 分钟后眩晕，Case-M01 §6.2）同向。
     留档备终审，参数与几何零改动。 */
  v5stupa: {
    label: 'V5 · 塔影仰观',
    cam: [0, 1.6, 1.5], fog: 0.045,
    inner:  null,
    middle: {k:8, r:4.2,  seg:2160, rings:[4.6,3.0,1.5], spokes:[4.6,5.2,48], color:'goldFar', op:0.75, pos:[0,2.8,-2.8]},
    ground: {k:4, r:5.0,  seg:1440, rings:[5.5,3.0], spokes:[5.5,6.2,24], color:'goldFar', op:0.45, y:0.02},
    orb: {r:0.07, color:'center', glow:1.2, pos:[0,2.8,-2.8]},
    /* W1 审查记录（09-19，独立复算）：主坛环面为竖直 XY 平面（rosePoints 原向，
       层未旋转），圆心 y=2.8 高于眼线 1.2m、仰角 +15°、角半径 49.4°（16 叶）——
       "仰观巨塔"在几何上成立；但坛体顶缘达 y≈8m、距相机仅 4.5m，压迫感是否过界、
       与 v3immersion（33° 角半径）的区分度是否足够，已回派设计师确认。 */
  },
  /* 〔2026-09-30 法师裁定·留档标注〕v6void 不下线不删：闸门金色占比 0.06% FAIL
     （09-19 裁丙留档）＋ Pico 真机体感「不适」（约 2 分钟后眩晕，Case-M01 §6.2）同向。
     留档备终审，参数与几何零改动。 */
  v6void: {
    label: 'V6 · 虚空',
    cam: [0, 1.6, 5.0], fog: 0.060,
    inner:  null,
    middle: {k:4, r:1.8,  seg:720,  rings:[2.0,1.1], spokes:[2.0,2.3,16], color:'goldFar', op:0.35, pos:[0,1.5,-14]},
    ground: {k:4, r:7.0,  seg:720,  rings:[7.6],                          color:'goldFar', op:0.25, y:0.02},
    orb: {r:0.08, color:'center', glow:1.5, pos:[0,1.5,-14]},
    /* ground op=0.25 低于 SOP 约束下限 0.3 → 法师 2026-09-19 批准特例
       （"虚空感需要极淡"，登记于此，SOP 约束表本身不擅自改）。
       W1 独立复算预警（09-19 订正：初稿曾误写透过率 0.4%，实算 exp(-(0.06·19)²)=0.273）：
       主坛距相机 19m → 雾透过率 27.3%、×op0.35 后可见度代理仅 0.095（近预警线 0.05）、
       角半径 6.9°；地面环透过率 90.6% 但 op=0.25→可见度 0.226。金色占比可能逼近
       像素判据 0.3% 下限，光点角半径仅 0.24°——"一点光"的语义成立，实测见分晓。 */
  },
};
const VARIANT_KEY = (new URLSearchParams(location.search).get('variant') || 's1').toLowerCase().replace(/-/g,'');
const spec = VARIANTS[VARIANT_KEY] || VARIANTS.s1;

/* ── 渲染器 / 场景 / 相机 ────────────────────────────── */
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true});
}catch(err){
  document.getElementById('load').innerHTML =
    '本环境无法初始化 WebGL：<br>' + (err && err.message ? err.message : err);
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(PALETTE.black, 1);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
/* 黑雾：不是氛围装饰，是纵深的物理表达——远处金线沉入黑暗。
   密度随变体（s1 低值保证外环可见但明显退远；v3 浓雾主动收窄视野） */
scene.fog = new THREE.FogExp2(PALETTE.black, spec.fog);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 200);
camera.position.set(...spec.cam);   // 立姿眼高，与修习者同高

/* ── 金线曼荼罗生成器（程序化，全部几何合并为少量 draw call）──
   三层纵深（v0.3 §四原则6"缓慢即昂贵"的空间表达：深度即安静）：
     内环 · 近身所缘（s1：y=1.15／z=-1.3＝胸腹高前方）：八叶玫瑰线（k=4）＋双细环
     中环 · 主坛城（s1：y=2.1／z=-6＝直立）：十六叶玫瑰线（k=8）＋三同心环＋32辐条
     外环 · 大地坛城（s1：y=0.02，平铺脚下）：大玫瑰线＋双环——立于坛城之中
   〔2026-09-17 AI-005 校正〕原文写"内环 z=-1.6／眼高前方"，是 09-16 自查修正
   （Case-M01 §3.2）之前的过期值；真值 z=-1.3／胸腹高 y=1.15。各层具体数值随
   变体而变，以 VARIANTS 注册表为准。〔2026-09-19 法师裁定 A1 甲后订正〕大地层
   已由 k=8（十六瓣）改为 **k=4（八瓣）**（s1 与 v2abyss 两处，注释见 VARIANTS），
   与 Case-M01 §二"八叶暗金"及 verify_mandala_s1.py 的 8 瓣断言恢复一致——此前的
   "三者不一致待裁定"已随裁定闭合（KZ-019 处置状态见台账）。
   玫瑰线 r=cos(kθ)：k 偶数时 2k 瓣；八叶＝k=4，十六叶＝k=8 */
function rosePoints(k, radius, segments, z){
  const pts = [];
  for(let i=0;i<segments;i++){
    const t0 = (i/segments)*Math.PI*2, t1 = ((i+1)/segments)*Math.PI*2;
    const r0 = Math.abs(Math.cos(k*t0))*radius, r1 = Math.abs(Math.cos(k*t1))*radius;
    pts.push(new THREE.Vector3(Math.cos(t0)*r0, Math.sin(t0)*r0, z));
    pts.push(new THREE.Vector3(Math.cos(t1)*r1, Math.sin(t1)*r1, z));
  }
  return pts;
}
function ringPoints(radius, segments, z){
  const pts = [];
  for(let i=0;i<segments;i++){
    const t0 = (i/segments)*Math.PI*2, t1 = ((i+1)/segments)*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(t0)*radius, Math.sin(t0)*radius, z));
    pts.push(new THREE.Vector3(Math.cos(t1)*radius, Math.sin(t1)*radius, z));
  }
  return pts;
}
function spokePoints(rIn, rOut, count, z){
  const pts = [];
  for(let i=0;i<count;i++){
    const t = (i/count)*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(t)*rIn, Math.sin(t)*rIn, z));
    pts.push(new THREE.Vector3(Math.cos(t)*rOut, Math.sin(t)*rOut, z));
  }
  return pts;
}
function lineMat(color, opacity){
  return new THREE.LineBasicMaterial({color, transparent:true, opacity,
                                      blending:THREE.AdditiveBlending,
                                      depthWrite:false, fog:true});
}

/* 通用层构建（09-16 变体化）：层规格缺省(null)则不建；
   s1 基准的三层参数与硬编码版逐值一致——变体系统不改基准 */
function buildLayer(cfg){
  if(!cfg) return null;
  const pts = [...rosePoints(cfg.k, cfg.r, cfg.seg, 0)];
  for(const rr of (cfg.rings||[])) pts.push(...ringPoints(rr, Math.max(180, cfg.seg/6), 0));
  if(cfg.spokes) pts.push(...spokePoints(cfg.spokes[0], cfg.spokes[1], cfg.spokes[2], 0));
  const m = new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    lineMat(PALETTE[cfg.color], cfg.op));
  if(cfg.pos) m.position.set(...cfg.pos);
  if(cfg.y !== undefined){ m.rotation.x = -Math.PI/2; m.position.y = cfg.y; }
  scene.add(m);
  return m;
}
const innerMesh  = buildLayer(spec.inner);
const middleMesh = buildLayer(spec.middle);
const groundMesh = buildLayer(spec.ground);

/* 中心光点：唯一"实体"——注意力的原点。位置：followInner 时与内环所缘
   同心（s1 语义），否则用显式 pos；半径/光晕强度随变体 */
const orbPos = spec.orb.followInner && innerMesh
  ? innerMesh.position.clone()
  : new THREE.Vector3(...(spec.orb.pos || [0,1.15,-1.3]));
const centerOrb = new THREE.Mesh(
  new THREE.SphereGeometry(spec.orb.r, 24, 16),
  new THREE.MeshBasicMaterial({color:PALETTE[spec.orb.color], transparent:true,
                               opacity:0.9, fog:false}));
centerOrb.position.copy(orbPos);
scene.add(centerOrb);
/* 中心微光晕（sprite 单枚，暖金，极淡）——给光点一点"呼吸感"的静态暗示；
   默认不动画（S1 纪律），?breath=on 时按通道丙 ±4% 缓动（scale 通道见 S2 块） */
const glowTex = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(32,32,0, 32,32,32);
  gr.addColorStop(0, 'rgba(227,203,118,0.55)');
  gr.addColorStop(0.4, 'rgba(212,175,90,0.18)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); return t;
})();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
glow.scale.setScalar(spec.orb.glow);
glow.position.copy(centerOrb.position);
scene.add(glow);

/* ── S2 空间呼吸（2026-09-30 法师裁「开工」·ZG-078·AI-008）──────────
   规格：01_项目管理\20260917_曼荼罗场域S2空间呼吸规格_v1.md §二（幅度实算反解）
   三通道（彼此独立、可分别验收，覆盖不同深度区间）：
     甲 · 雾场 FogExp2.density     Δρ=±0.0040 绝对   周期 34s 相位 90°
     乙 · 各层 opacity ×(1±4%)     三层错相 120°     周期 26s（近身呼吸载体）
     丙 · 中心光晕 glow.scale ±4%                    周期 13s 相位 180°
   开关：默认 ON（2026-10-01 法师 Pico 真机验收三格全过后金口「翻为开」，
         D 分片登记）；?breath=off 关断＝S1 完全静态，六变体闸/S1 闸/
         静态纪律闸的回归锚判据照规格 §三.4 全部改走显式 ?breath=off 复跑，
         「绝对安静」仍可回归，两者互不掩盖。
   纪律（规格 §二）：目标值慢正弦驱动＋一阶平滑跟随（τ=周期/6）；dt 取动画循环
   真实时间差、禁固定步长；相位固定不重算（跳变唯一来源已封）；绝不缩放坛城
   本体（丙通道缩的是所缘周围微光，规格 §二已论证非本体）；不动视点。 */
const BREATH_ON = (new URLSearchParams(location.search).get('breath') || 'on') !== 'off';
const BREATH = BREATH_ON ? {
  fog:  { base: spec.fog,      amp: 0.0040, period: 34, phase: Math.PI / 2,     tau: 34 / 6 },
  opac: {                      amp: 0.04,   period: 26,                         tau: 26 / 6 },
  glow: { base: spec.orb.glow, amp: 0.04,   period: 13, phase: Math.PI,         tau: 13 / 6 },
} : null;
/* 乙通道按现存层建状态（inner 可为 null 变体）；相位固定 内0°/中120°/外240° */
const breathLayers = BREATH_ON
  ? [innerMesh, middleMesh, groundMesh]
      .map((m, i) => m ? { mesh: m, base: m.material.opacity,
                           phase: i * 2 * Math.PI / 3, cur: m.material.opacity } : null)
      .filter(Boolean)
  : [];
const breathState = BREATH_ON
  ? { fog: spec.fog, glow: spec.orb.glow, lastT: null }
  : null;

/* ══ 五段路径骨架（件 3，2026-10-10，W1·VR 场景设计专责窗）════════
   五段＝用户路径拆分，**不替代 S3 五相义理定义**（协调正本 §12.2 原边界）。
   默认关闭：URL 不带 ?stage=1 时本块只执行一次常量判断，不建 DOM、不注册
   回调、不进渲染循环 ⇒ 已认可版本的逐像素行为不变（循 S2 呼吸"显式关断
   仍可回归"的先例，规格 §三.4）。
   两条由现有闸门逼出的实现约束（不是偏好）：
     · 时长一律由渲染循环的真实时间差驱动——静态闸源码级禁定时器
       （vr_gates/verify_mandala_static.py:119）。
     · 本块不得引入任何音视频元素——同闸 :118 源码级禁，故"退出四条件"里
       的声音一项在本场景**结构上为 N/A**，如实标注，不冒认通过。 */
const QSTAGE = new URLSearchParams(location.search);
const STAGE_ON = QSTAGE.get('stage') === '1';
const ENTER_S  = 3.0;                       // 段1 黑场渐隐（义理值候裁，件2 §五 N5）
const GATHER_S = 6.0;                       // 段4 回基线渐变（同上候裁）
const SEGSEC   = parseFloat(QSTAGE.get('segsec') || '20');   // 合成契约段驻留，默认 20 s
const SYNTH_ON = STAGE_ON && QSTAGE.get('synth') !== '0';
const SYNTH_SEQ = [0.2, 0.5, 0.7, 0.4];     // 件2 §三 合成输入序列（固定可重放）
const XR_MOCK  = STAGE_ON && QSTAGE.get('xrmock') === '1';
const MOCK_END_MS = parseFloat(QSTAGE.get('mockend') || '0');

const STAGES = STAGE_ON ? [
  { key: 'enter',  cn: '进入', dur: ENTER_S },
  { key: 'dwell',  cn: '安住', dur: SEGSEC },
  { key: 'change', cn: '变化', dur: SEGSEC * SYNTH_SEQ.length },
  { key: 'gather', cn: '收束', dur: GATHER_S },
  { key: 'exit',   cn: '退出', dur: 0 },
] : null;

/* 变化段载体缺口（实测，非推测）：本机 WebGL2 下
   ALIASED_LINE_WIDTH_RANGE＝[1,1]（AMD 8060S／SwiftShader 两路同果），
   three.js 的 LineBasicMaterial.linewidth 被渲染器忽略 ⇒ 件2 §段3 的
   "线宽微观呼吸"在本技术栈**不可实现**，载体形式候法师择（件3 出件 §三）。
   本块因此对 change 段只记三值分层事件，不伪造任何视觉变化。 */

const stage = STAGE_ON ? {
  on: true, idx: 0, t0: null, lastT: null, wallT0: null,
  events: [], synthEmitted: -1, fault: false, tickErr: null,
  exitAt: null, endCalledAt: null, endAt: null, endObserved: false,
  fromSystem: false, endErr: null, report: null, gatherDone: false,
} : { on: false };
const baseSnap = STAGE_ON ? {
  fog: scene.fog.density,
  opac: breathLayers.map(L => L.base),
  glow: BREATH_ON ? BREATH.glow.base : glow.scale.x,
} : null;
let xrSessionRef = null;

function pushEvent(kind, extra) {
  const e = Object.assign({
    phase: STAGES[stage.idx].key,
    atSec: +(performance.now() / 1000 - stage.wallT0).toFixed(3),
    variant: VARIANT_KEY, kind,
  }, extra || {});
  stage.events.push(e);
  return e;
}

function synthStep(i) {
  /* 三值分层：measure（合成值）／suggest（决策层）／output（最终场景输出）
     分列不合并；未接线者留 null，不以 0 填充（件2 §三）。 */
  stage.events.push({
    phase: 'change', atSec: +(performance.now() / 1000 - stage.wallT0).toFixed(3),
    variant: VARIANT_KEY, kind: 'synth', synth: true, seqIndex: i,
    measure: SYNTH_ON ? SYNTH_SEQ[i] : null,
    suggest: null, output: null,
    note: 'suggest 未接线（决策层属 S6）；output 无载体（linewidth 恒 1px 实测）',
  });
}

function stageFreezesBreath() {
  /* 收束／退出段：三路归"回基线"独占，呼吸驱动暂停。这不是改呼吸参数——
     三路 amp/period/tau 一字未动，只是段路径要求"停止引入任何新变化"。 */
  return STAGE_ON && stage.idx >= STAGES.length - 2;
}

function returnToBase(dt, hard) {
  /* 收束＝把三路拉回进入前基线；hard＝退出已发生，立即锁定（红线 5：
     退出安全不得等待渐变）。锁定后呼吸不再接管，故基线不会被覆盖回去。 */
  if (hard) {
    scene.fog.density = baseSnap.fog;
    glow.scale.setScalar(baseSnap.glow);
    for (const L of breathLayers) { L.cur = L.base; L.mesh.material.opacity = L.cur; }
    if (BREATH_ON) { breathState.fog = baseSnap.fog; breathState.glow = baseSnap.glow; }
    return;
  }
  const follow = 1 - Math.exp(-dt / (GATHER_S / 6));
  if (BREATH_ON) {
    breathState.fog  += (baseSnap.fog  - breathState.fog)  * follow;
    breathState.glow += (baseSnap.glow - breathState.glow) * follow;
    scene.fog.density = breathState.fog;
    glow.scale.setScalar(breathState.glow);
    for (const L of breathLayers) {
      L.cur += (L.base - L.cur) * follow;
      L.mesh.material.opacity = L.cur;
    }
  }
  const rel = baseDelta().max;
  if (rel <= 0.005 && !stage.gatherDone) {
    stage.gatherDone = true;
    pushEvent('base_returned', { maxRel: +rel.toExponential(2) });
  }
}

function baseDelta() {
  const cur = { fog: scene.fog.density,
                opac: breathLayers.map(L => L.mesh.material.opacity),
                glow: glow.scale.x };
  const rel = (a, b) => Math.abs(a - b) / Math.max(Math.abs(b), 1e-9);
  let max = rel(cur.fog, baseSnap.fog);
  cur.opac.forEach((o, i) => { max = Math.max(max, rel(o, baseSnap.opac[i])); });
  max = Math.max(max, rel(cur.glow, baseSnap.glow));
  return { max, cur, base: baseSnap };
}

/* 桌面无 WebXR 时的退出路径自测钩子：只验"我方发退出→调 session.end→
   收到 end 事件"的时序与是否等待渐变，**不碰 renderer.xr、不验 WebXR 本身**
   （真机 WebXR 须法师在场，金口#7）。 */
function makeMockSession() {
  const ls = {};
  const fire = (k) => (ls[k] || []).forEach(f => { try { f({ type: k }); } catch (e) {} });
  return {
    isMock: true,
    addEventListener: (k, f) => { (ls[k] = ls[k] || []).push(f); },
    end() {
      if (MOCK_END_MS <= 0) { requestAnimationFrame(() => fire('end')); return Promise.resolve(); }
      const t0 = performance.now();
      (function poll() {
        if (performance.now() - t0 >= MOCK_END_MS) { fire('end'); return; }
        requestAnimationFrame(poll);
      })();
      return Promise.resolve();
    },
  };
}

function finalizeReport(reason) {
  const d = baseDelta();
  const hasAudio = !!(document.querySelector('audio') || document.querySelector('video'));
  const ourPathMs = (stage.endCalledAt !== null && stage.exitAt !== null)
    ? +(stage.endCalledAt - stage.exitAt).toFixed(1) : null;
  const endToEndMs = (stage.endAt !== null && stage.exitAt !== null)
    ? +(stage.endAt - stage.exitAt).toFixed(1) : null;
  const xr = stage.endObserved
    ? { verdict: (stage.exitAt === null || ourPathMs <= 500) ? 'PASS' : 'FAIL',
        mock: !!XR_MOCK, fromSystem: !!stage.fromSystem,
        presentingAfter: renderer.xr.isPresenting, ourPathMs, endToEndMs }
    : { verdict: 'FAIL', reason: '未收到 end 事件', mock: !!XR_MOCK, ourPathMs, endToEndMs };
  stage.report = {
    variant: VARIANT_KEY, variantLabel: spec.label,
    measured: false,                 // 本场景全程不接脑电，无测量
    synthOnly: SYNTH_ON,
    reason,
    conditions: {
      xrSessionEnded: xr,
      soundStopped: hasAudio
        ? { verdict: 'PENDING', reason: '存在媒体元素，须实测 paused/currentTime 与听感' }
        : { verdict: 'N/A', reason: '本场景源码级禁音视频（verify_mandala_static.py:118），无音频可停；S4 接入后须实测且听感候法师在场' },
      feedbackAtBaseline: {
        /* 锁定后的瞬时偏差恒 0，属"由构造成立"；真读数看锁定前的
           deltaAtExitRel——收束渐变被退出打断时它不为 0，如实呈。 */
        verdict: d.max <= 0.005 ? 'PASS' : 'FAIL',
        maxRelDeltaAfterSnap: +d.max.toExponential(2),
        maxRelDeltaAtExitInstant: stage.deltaAtExit === undefined ? null
          : +stage.deltaAtExit.toExponential(2),
        phaseAtExit: stage.phaseKeyAtExit || null,
        phaseElapsedSecAtExit: stage.phaseElapsedAtExit === undefined ? null
          : +stage.phaseElapsedAtExit.toFixed(3),
        gatherSecPlanned: GATHER_S,
        byConstruction: '退出即锁定三路（红线 5 要求不等渐变），故锁定后偏差恒 0',
        note: d.max <= 0.005 ? '三路参数等于进入前快照（锁定后）' : '锁定后仍偏离基线——异常',
        cur: d.cur, base: d.base,
      },
      dataSaved: { verdict: 'N/A', reason: '本场景不落盘、不采集（S6 未接），无保存返回码' },
    },
    errors: [window.__vrErr, stage.endErr].filter(Boolean),
    events: stage.events,
  };
  window.__stageReport = stage.report;
  /* 头显侧经 adb logcat 取证的出口（PICO CLI 观察面） */
  console.log('ZHIGUAN_EXIT_REPORT ' + JSON.stringify(stage.report));
  renderExitPanel(stage.report);
}

function requestExit(reason) {
  if (!STAGE_ON || stage.idx === STAGES.length - 1) return;
  stage.exitAt = performance.now();
  /* 退出瞬间先量三路偏离基线程度，再锁定——顺序很要紧：锁定后偏差恒 0，
     只报锁定后的值等于自证通过（红线4 ③ 的真读数会丢）。 */
  stage.deltaAtExit = baseDelta().max;
  stage.phaseElapsedAtExit = (stage.exitAt - stage.phaseAt) / 1000;
  stage.phaseKeyAtExit = STAGES[stage.idx].key;
  stage.idx = STAGES.length - 1;
  stage.t0 = performance.now() / 1000;
  /* 红线 5：退出即时生效——先结束会话，不等收束渐变；随后硬锁三路回基线 */
  const s = xrSessionRef;
  if (s) {
    stage.endCalledAt = performance.now();
    try { s.end(); } catch (e) { stage.endErr = String((e && e.message) || e); }
  } else {
    stage.endCalledAt = stage.exitAt;
    stage.endAt = stage.exitAt;
    stage.endObserved = true;
  }
  returnToBase(0, true);
  pushEvent('exit', { reason, ourPathMs: +(stage.endCalledAt - stage.exitAt).toFixed(1) });
  if (!s) finalizeReport(reason);      // 有会话时由 end 事件收口，latency 才是真测
}

function onSessionEnd() {
  stage.endObserved = true;
  stage.endAt = performance.now();
  if (stage.exitAt === null) { stage.exitAt = stage.endAt; stage.endCalledAt = stage.endAt; stage.fromSystem = true; }
  finalizeReport(stage.fromSystem ? 'system' : 'button');
}

function renderExitPanel(rep) {
  /* 红线 2／§12.3：退出后**只显示** 是否采集／是否保存／异常，不弹绩效评分。
     "只显示"照做：HUD 与段标识条一并撤下，面板不透明（半透明会让坛城
     与标识条透出，与三行文字叠在一起——03:4x 截图实测）。 */
  const p = document.getElementById('stageReport');
  if (!p) return;
  const errs = rep.errors.length ? rep.errors.join('；') : '无';
  p.innerHTML =
    '<div class="t">体验已结束</div>' +
    '<div>是否采集：否（本场景不接脑电，全程无测量数据）</div>' +
    '<div>是否保存：否（本场景不落盘）</div>' +
    '<div>异常：' + errs + '</div>' +
    '<div class="s">版本 ' + rep.variant + '（' + rep.variantLabel + '）</div>' +
    '<div class="h">想再来一次：点左下「进入 VR」（须戴头显或支持 WebXR 的浏览器），' +
    '或刷新本页面；想离开：直接关闭本页面</div>';
  p.style.display = 'flex';          // 必须 flex：居中靠 align/justify，block 下不生效
  const hud = document.getElementById('hud');
  if (hud) hud.style.display = 'none';
  if (badgeEl) badgeEl.style.display = 'none';
  /* 面板 inset:0 会盖住按钮条，把按钮抬到面板之上，退出后仍可再进入 */
  document.getElementById('bar').style.zIndex = '23';
}

function stageTick(timeMs) {
  try {
    stageTickInner(timeMs);
  } catch (e) {
    /* 骨架自身出错必须可见：记一次事件并停走，不静默每帧刷屏（闸判据 5 检此键） */
    if (!stage.fault) {
      stage.fault = true;
      stage.tickErr = String((e && e.message) || e);
      stage.events.push({ phase: STAGES[stage.idx].key, kind: 'stage_error',
                          atSec: +(performance.now() / 1000 - stage.wallT0).toFixed(3),
                          error: stage.tickErr });
    }
  }
}

function stageTickInner(timeMs) {
  const t = timeMs / 1000;
  if (stage.t0 === null) {
    stage.wallT0 = performance.now() / 1000;
    stage.t0 = t; stage.lastT = t;
    stage.phaseAt = performance.now();
    pushEvent('phase_begin'); updateBadge();
    return;
  }
  const dt = Math.min(Math.max(t - stage.lastT, 0), 0.5);
  stage.lastT = t;
  const p = STAGES[stage.idx];

  /* 进入段不再由 JS 推黑场——见 #stageFade 纯 CSS 动画（rAF 停摆时会盖黑） */
  if (p.key === 'change' && SYNTH_ON) {
    const i = Math.min(SYNTH_SEQ.length - 1, Math.floor((t - stage.t0) / SEGSEC));
    while (stage.synthEmitted < i) { stage.synthEmitted += 1; synthStep(stage.synthEmitted); }
  }
  if (p.key === 'gather' || p.key === 'exit') returnToBase(dt, p.key === 'exit');
  /* 收束段不自动跳退出：结束须由使用者主动发起（§12.3「随时可用」） */
  if (p.dur > 0 && stage.idx < STAGES.length - 2 && (t - stage.t0) >= p.dur) {
    stage.idx += 1; stage.t0 = t;
    stage.phaseAt = performance.now();
    if (STAGES[stage.idx].key === 'change') stage.synthEmitted = -1;
    pushEvent('phase_begin'); updateBadge();
  }
}

/* 段标识条：只写 DOM 文本，不触场景状态。声明在模块顶层——
   ES module 严格模式下块内函数声明只在块内可见，原先写在 if 块里
   导致 stageTick 每帧 ReferenceError、时序停走（03:3x 冒烟实测）。 */
let badgeEl = null;
function updateBadge() {
  if (!badgeEl || !STAGE_ON) return;
  const p = STAGES[stage.idx];
  /* 每行都保持短字幅：左上 HUD 已带长题名，右侧若重复整行会在窄视口与它
     撞成一片叠字（真浏览器 03:4x 实测抓到，无头 1280 宽看不出来）。
     变体仍在本条内——件2 段1 判据要求标识条含"版本＋有无测量"两字段。 */
  badgeEl.textContent =
    '第' + (stage.idx + 1) + '段 ' + p.cn + '\n' +
    '版本 ' + VARIANT_KEY + '\n' +
    '测量：无（不接脑电）\n' +
    '数据：' + (SYNTH_ON ? '模拟（非测量）' : '无');
  badgeEl.style.whiteSpace = 'pre';
}

/* ── 段骨架专用的屏上元素（仅 ?stage=1 时创建，默认态零 DOM 变化）── */
if (STAGE_ON) {
  const st = document.createElement('style');
  st.textContent =
    /* 进入段黑场＝纯 CSS 动画，零 JS 依赖：动画跑不跑都不挡点击（pointer-events:none）、
       跑完自己透明（forwards）。若改由 rAF 推，页面一旦不可见即永久盖黑。 */
    '#stageFade{position:fixed;inset:0;z-index:21;background:#000;pointer-events:none;' +
    'animation:zgEnterFade ' + ENTER_S + 's linear forwards}' +
    '@keyframes zgEnterFade{from{opacity:1}to{opacity:0}}' +
    '#stageBadge{position:fixed;right:16px;top:14px;z-index:12;font-size:12px;' +
    'line-height:1.7;color:#8a7a5c;letter-spacing:1px;text-align:right;user-select:none}' +
    '#stageReport{position:fixed;inset:0;z-index:22;background:#000;display:none;' +
    'color:#c9b287;font-size:15px;line-height:2.1;letter-spacing:1px;text-align:left;' +
    'align-items:center;justify-content:center;flex-direction:column}' +
    '#stageReport .t{font-size:18px;letter-spacing:4px;margin-bottom:10px}' +
    '#stageReport .s{color:#6b5630;font-size:12px;margin-top:14px}' +
    '#stageReport .h{color:#6b5630;font-size:12px;margin-top:6px}';
  document.head.appendChild(st);
  const fade = document.createElement('div');
  fade.id = 'stageFade'; document.body.appendChild(fade);
  fade.addEventListener('animationend', () => { fade.style.display = 'none'; });
  /* 页面不可见时 CSS 动画同样被节流（实测 hidden 下 opacity 恒 1）⇒ 直接不演
     这段渐隐。原则＝进入段可有可无，场景绝不能被盖住。 */
  const killFade = () => { fade.style.display = 'none'; };
  if (document.visibilityState !== 'visible') killFade();
  document.addEventListener('visibilitychange',
    () => { if (document.visibilityState !== 'visible') killFade(); });
  badgeEl = document.createElement('div');
  badgeEl.id = 'stageBadge'; document.body.appendChild(badgeEl);
  const rep = document.createElement('div');
  rep.id = 'stageReport'; document.body.appendChild(rep);
  const btnExit = document.createElement('button');
  btnExit.id = 'btnExit'; btnExit.textContent = '退出';
  document.getElementById('bar').appendChild(btnExit);
  btnExit.onclick = () => requestExit('button');
  window.__stageCtl = {
    exit: () => requestExit('api'),
    state: () => stage,
    report: () => stage.report,
    events: () => stage.events,
  };
  updateBadge();
} else {
  window.__stageCtl = null;
}

/* ── 主循环：默认完全静态（渲染循环只为 WebXR 帧同步存在）──────
   ?breath=on 时三通道按规格更新——除此之外仍无任何 per-frame 状态更新；
   breath=off 路径与 S1 逐字节同行为（连续帧差恒 0 的"绝对安静"判据保留） */
renderer.setAnimationLoop((time)=>{
  if (STAGE_ON && !stage.fault && !stageFreezesBreath()) stageTick(time);

  if (BREATH_ON && breathState.lastT !== null && !stageFreezesBreath()) {
    const t = time / 1000;
    const dt = Math.min(Math.max(t - breathState.lastT, 0), 0.5);   // 钳大间隙防跳变
    breathState.lastT = t;
    const follow = tau => 1 - Math.exp(-dt / tau);
    const twoPi = Math.PI * 2;
    /* 甲 · 雾场（主通道，真实纵深——远处起效，近身所缘不动，规格 §二量级论证） */
    const fogTarget = BREATH.fog.base
      + BREATH.fog.amp * Math.sin(twoPi * t / BREATH.fog.period + BREATH.fog.phase);
    breathState.fog += (fogTarget - breathState.fog) * follow(BREATH.fog.tau);
    scene.fog.density = breathState.fog;
    /* 乙 · 坛城明暗（近身呼吸载体；三层错相 120°，读作"空间在呼吸"非"整块在闪"） */
    for (const L of breathLayers) {
      const opTarget = L.base * (1 + BREATH.opac.amp
        * Math.sin(twoPi * t / BREATH.opac.period + L.phase));
      L.cur += (opTarget - L.cur) * follow(BREATH.opac.tau);
      L.mesh.material.opacity = L.cur;
    }
    /* 丙 · 中心光晕尺度（所缘的呼吸暗示；非坛城本体） */
    const glowTarget = BREATH.glow.base * (1 + BREATH.glow.amp
      * Math.sin(twoPi * t / BREATH.glow.period + BREATH.glow.phase));
    breathState.glow += (glowTarget - breathState.glow) * follow(BREATH.glow.tau);
    glow.scale.setScalar(breathState.glow);
  } else if (BREATH_ON) {
    breathState.lastT = time / 1000;   // 首帧只记基准时刻，次帧起呼吸
  }
  renderer.render(scene, camera);
});

/* ── VR 进入（复用既有 WebXR 模式：HTTPS 8778 下 Pico 可用） ── */
const btnVR = document.getElementById('btnVR');
btnVR.onclick = async ()=>{
  if(!navigator.xr && !XR_MOCK){ alert('本浏览器不支持 WebXR'); return; }
  try{
    /* XR_MOCK 只在 ?stage=1&xrmock=1 下生效：不碰 renderer.xr，专供退出路径
       时序自测（真机 WebXR 须法师在场，本路径不冒称验过 WebXR）。 */
    const session = XR_MOCK ? makeMockSession()
      : await navigator.xr.requestSession('immersive-vr',
          {optionalFeatures:['local-floor','bounded-floor']});
    if (!XR_MOCK) renderer.xr.setSession(session);
    xrSessionRef = session;
    session.addEventListener('end', ()=>{
      btnVR.textContent = '进入 VR';
      xrSessionRef = null;
      if (STAGE_ON) onSessionEnd();
    });
    btnVR.textContent = XR_MOCK ? 'VR 中（模拟）' : 'VR 中';
    if (STAGE_ON) pushEvent('session_begin', { mock: !!XR_MOCK });
  }catch(err){
    alert('进入 VR 失败：' + (err && err.message ? err.message : err));
  }
};

/* ── 桌面视角微调（非 VR 时：鼠标缓动环视 ±6°，帮助桌面截图取景；
   Pico 内以头显姿态为准，本段不生效——renderer.xr.isPresenting 时跳过。
   幅度极小且经阻尼，不构成"动效"，不违 S1 静态纪律） ── */
let targetYaw = 0, curYaw = 0;
addEventListener('mousemove', e=>{
  if(renderer.xr.isPresenting) return;
  targetYaw = ((e.clientX/innerWidth) - 0.5) * 0.21;   // ±6°
});

/* 诊断钩子：供无头验收脚本读取场景构成（同 vr_feedback __vrDiag 先例）
   〔2026-09-17 AI-005 修〕两种口径分开报，不再混用：
     layers = **花瓣数**（2k）——verify_mandala_s1.py 判据"8/16/8 瓣"用的就是它；
     k      = 玫瑰线参数（k 偶数 → 2k 瓣）。
   原钩子（ef97132）写死 {inner:8, middle:16, ground:8}；变体化重构（1d09139）
   改成报 k（4/8/8），字段含义被静默改掉而判据脚本未动 → 该脚本必然误报失败。
   现由注册表实算，两套口径同时给出，杜绝"钩子自述与几何不符"。
   〔2026-09-19 法师裁定 A1 甲后订正〕s1 大地层已改 k=4＝八瓣（v2abyss 同），
   与 Case-M01"八叶暗金"及判据脚本断言 8 恢复一致；本注释保留历史说明不改写。 */
const petalsOf = c => (c ? c.k * 2 : null);
/* 纵深可测量化：把"三层纵深"从说法变成数字（无头验收可断言，不依赖人眼）。
   angRadiusDeg＝该层最外圈在层深度上的等效张角（对正对相机的立层成立）；
   fogTransmittance＝FogExp2 在该深度的剩余可见度 exp(-(ρd)²)。
   ⚠️ 大地层是平铺的，"距离"取层原点距离，等效张角仅供层间比较。 */
function depthMetrics(cfg){
  if(!cfg) return null;
  const p = cfg.pos || [0, (cfg.y !== undefined ? cfg.y : 0), 0];
  const dx = p[0] - spec.cam[0], dy = p[1] - spec.cam[1], dz = p[2] - spec.cam[2];
  const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
  let rOut = cfg.r;
  for(const rr of (cfg.rings || [])) rOut = Math.max(rOut, rr);
  if(cfg.spokes) rOut = Math.max(rOut, cfg.spokes[1]);
  return {
    pos: [+p[0].toFixed(3), +p[1].toFixed(3), +p[2].toFixed(3)],
    dist: +dist.toFixed(3),
    rOut: +rOut.toFixed(3),
    angRadiusDeg: +(Math.atan2(rOut, dist) * 180 / Math.PI).toFixed(1),
    elevDeg: +(Math.atan2(dy, Math.sqrt(dx*dx + dz*dz)) * 180 / Math.PI).toFixed(1),
    fogTransmittance: +Math.exp(-Math.pow(spec.fog * dist, 2)).toFixed(3),
  };
}
window.__mandalaDiag = {
  stage: BREATH_ON ? 'S2' : 'S1',
  variant: VARIANT_KEY,
  variantLabel: spec.label,
  fog: spec.fog,
  cam: spec.cam,
  layers: {
    inner:  petalsOf(spec.inner),
    middle: petalsOf(spec.middle),
    ground: petalsOf(spec.ground),
  },
  k: {
    inner:  spec.inner  ? spec.inner.k  : null,
    middle: spec.middle ? spec.middle.k : null,
    ground: spec.ground ? spec.ground.k : null,
  },
  depth: {
    inner:  depthMetrics(spec.inner),
    middle: depthMetrics(spec.middle),
    ground: depthMetrics(spec.ground),
  },
  drawCallsScene: scene.children.length,
  center: [centerOrb.position.x, centerOrb.position.y, centerOrb.position.z],
  palette: PALETTE,
  static: !BREATH_ON,
  /* 五段路径骨架自述（件3）。字段名用 pathStage——`stage` 已被上方闸门级
     标注占用（'S1'/'S2'），撞键会静默覆盖既有闸的读数。 */
  pathStage: STAGE_ON ? {
    enabled: true, phases: STAGES.map(s => s.key),
    enterSec: ENTER_S, segSec: SEGSEC, gatherSec: GATHER_S,
    synth: SYNTH_ON, synthSeq: SYNTH_SEQ, xrmock: !!XR_MOCK,
    carrierGap: '变化段无视觉载体：WebGL2 下 ALIASED_LINE_WIDTH_RANGE=[1,1]（实测）',
  } : { enabled: false },
  /* S2 呼吸自述（verify_mandala_breath.py 可对独立复算）：
     enabled=false 即默认态＝S1 回归锚；enabled=true 时三通道参数与规格逐值对应 */
  breath: BREATH_ON ? {
    enabled: true,
    spec: '20260917_曼荼罗场域S2空间呼吸规格_v1.md §二',
    fog:   { base: BREATH.fog.base, amp: BREATH.fog.amp, period: BREATH.fog.period,
             phaseDeg: 90, tau: BREATH.fog.tau },
    opacity: { amp: BREATH.opac.amp, period: BREATH.opac.period, tau: BREATH.opac.tau,
               layerPhasesDeg: breathLayers.map(L =>
                 +((L.phase * 180 / Math.PI) % 360).toFixed(0)) },
    glow:  { base: BREATH.glow.base, amp: BREATH.glow.amp, period: BREATH.glow.period,
             phaseDeg: 180, tau: BREATH.glow.tau },
  } : {
    enabled: false,
    note: '默认静态＝S1 回归锚；?breath=on 启用 S2 三通道呼吸',
  },
};

/* HUD 标注当前变体（桌面预览对比时肉眼可辨）
   〔2026-09-17 AI-005 修〕原为 '曼荼罗场域 · S1 · ' + label，而 label 自带
   "S1 基准 ·…"，实际渲染成"曼荼罗场域 · S1 · S1 基准 · 三层纵深"（S1 重复）。
   去掉前缀里的 S1，保留 label 的完整题名。 */
document.getElementById('hud').textContent =
  '曼荼罗场域 · ' + spec.label + (BREATH_ON ? ' · S2 呼吸中' : '');

/* 载入完成：撤黑场（不做渐显动画——S1 静态纪律；黑场即底色）。
   无条件撤除，**不得挂在动画循环上**：?stage=1 曾把撤除交给 stageTick，
   结果页面一旦不可见（后台标签／头显 2D 视图未聚焦），rAF 停摆、段机零帧、
   不透明黑场永久盖住整屏＝法师 10-10 真机所见"打开只剩空白"（实测
   visibilityState=hidden 时 rafFrames=0）。进入段的渐隐改由纯 CSS 动画承担。 */
document.getElementById('load').style.display = 'none';

/* 窗口自适应 */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* 桌面环视的阻尼跟随放在渲染循环外：用 rAF 低频更新（30fps 足够，
   且 XR presenting 时完全不写相机——头显姿态优先） */
(function dampLoop(){
  requestAnimationFrame(dampLoop);
  if(renderer.xr.isPresenting) return;
  curYaw += (targetYaw - curYaw) * 0.04;
  camera.rotation.y = -curYaw;
})();
</script>
</body>
</html>
