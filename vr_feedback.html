<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

/* ── 状态 ─────────────────────────────────────────────── */
const S = {
  connected:false, source:null, elapsed:0, state:'', phase:'',
  bands:{}, vitals:{},
  a:0.5, th:0.5, hr:0,              // 平滑后的视觉参数 0..1 / bpm（初值0.5＝中性）
  aTarget:0.5, thTarget:0.5,        // EMA 目标值（每 2 秒由新 bands 更新一次）
  autoTheme:true, model:null, modelList:[]
};
const $ = id => document.getElementById(id);
const hud = $('hud'), msg = $('msg');
let msgT = 0;
function say(t){ msg.textContent = t; msgT = Date.now(); }
function saySticky(t){ msg.textContent = t; msgT = Infinity; }  // 错误等需常驻的提示

/* ── 渲染器 / 场景 ────────────────────────────────────── */
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true});
}catch(err){
  document.getElementById('load').innerHTML =
    '本环境无法初始化 WebGL 3D 渲染：<br>' + (err && err.message ? err.message : err) +
    '<br><span style="font-size:12px;color:#8fb4c6">请在 Pico 浏览器或带 GPU 的桌面浏览器打开本页</span>';
  document.getElementById('load').style.color = '#ff9d9d';
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1622, 0.028);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 300);
camera.position.set(0,1.6,3.2);

scene.add(new THREE.HemisphereLight(0x9fc6e8, 0x10202c, 0.55));
const sun = new THREE.DirectionalLight(0xffd9a8, 0.9);
sun.position.set(4,6,2); scene.add(sun);

/* 天穹渐变 */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(120,32,20),
  new THREE.ShaderMaterial({side:THREE.BackSide, uniforms:{
    uTop:{value:new THREE.Color(0x0b1d33)}, uBot:{value:new THREE.Color(0x37233a)}, uGlow:{value:0.3}},
    vertexShader:`varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vP; uniform vec3 uTop,uBot; uniform float uGlow;
      void main(){float h=normalize(vP).y*.5+.5;
        vec3 c=mix(uBot,uTop,smoothstep(.05,.75,h));
        c+=vec3(.9,.55,.3)*pow(max(0.,1.-abs(h-.16)*4.),3.)*uGlow*.6;
        gl_FragColor=vec4(c,1.);}`
  }));
scene.add(sky);

/* 水面：脑电驱动涟漪与辉光 */
const waterU = {uT:{value:0}, uA:{value:.3}, uTh:{value:.3}, uCol:{value:new THREE.Color(0x2f8fb8)}};
const water = new THREE.Mesh(new THREE.CircleGeometry(40,96),
  new THREE.ShaderMaterial({uniforms:waterU,
    vertexShader:`varying vec2 vUv; varying vec3 vP;
      uniform float uT,uA,uTh;
      void main(){vUv=uv; vec3 p=position;
        float r=length(p.xy);
        p.z += sin(r*1.6-uT*0.5)*(.05+.16*uA) + sin(p.x*.8+uT*0.3)*.03*uTh;
        vP=p; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
    fragmentShader:`varying vec2 vUv; varying vec3 vP; uniform float uT,uA,uTh; uniform vec3 uCol;
      void main(){float r=length(vUv-.5)*2.;
        float ring=.5+.5*sin(r*22.-uT*0.55);
        vec3 c=mix(uCol*.25,uCol,(.25+.75*uA)*ring*smoothstep(1.,.15,r));
        c+=uCol*pow(max(0.,1.-r*1.15),3.)*(.35+.9*uA);
        c+=vec3(.6,.8,1.)*uTh*.06*sin(vUv.x*60.+uT*0.45);
        gl_FragColor=vec4(c,1.);}`
  }));
water.rotation.x = -Math.PI/2; scene.add(water);

/* 心息之珠：随心率/呼吸脉动 */
const orb = new THREE.Mesh(new THREE.SphereGeometry(.28,48,32),
  new THREE.MeshStandardMaterial({color:0x8fd8ff, emissive:0x2a7fa8,
    emissiveIntensity:1.2, roughness:.25, metalness:.1}));
orb.position.set(0,1.25,-1.4); scene.add(orb);  // 固定在观者(z=3.2)与本尊模型(z≈-6)的中点 z=-1.4；y=胸口高度（09-10法师实测：往复移动干扰禅修，改为定点呼吸胀缩）

/* 念珠粒子：Theta 驱动漂移 */
const PN = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PN*3), pSeed = new Float32Array(PN);
for(let i=0;i<PN;i++){
  const r = 2+Math.random()*14, a = Math.random()*Math.PI*2;
  pPos[i*3]=Math.cos(a)*r; pPos[i*3+1]=.2+Math.random()*5; pPos[i*3+2]=Math.sin(a)*r;
  pSeed[i]=Math.random();
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('seed', new THREE.BufferAttribute(pSeed,1));
const pMat = new THREE.PointsMaterial({color:0xbfe8ff,size:.06,transparent:true,
  opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(pGeo,pMat));

/* ── 状态 → 配色 ──────────────────────────────────────── */
const THEMES = {
  calm:   {col:0x3fae8c, top:0x0a2430, bot:0x24343a},
  focused:{col:0x3f8fae, top:0x0b1d33, bot:0x2a2f44},
  drowsy: {col:0x7a6fae, top:0x141026, bot:0x2e2438},
  active: {col:0xae7a4f, top:0x241408, bot:0x3a2a1e},
  default:{col:0x2f8fb8, top:0x0b1d33, bot:0x37233a},
};
function themeFor(state){
  const s=(state||'').toString();
  if(s.includes('静')||s.includes('calm')) return THEMES.calm;
  if(s.includes('专注')||s.includes('focus')) return THEMES.focused;
  if(s.includes('昏')||s.includes('睡')||s.includes('drow')) return THEMES.drowsy;
  if(s.includes('动')||s.includes('散')||s.includes('active')) return THEMES.active;
  return THEMES.default;
}
let curCol = new THREE.Color(THEMES.default.col);

/* ── 频段 → 画面 映射 v2（2026-09-08 凌晨，经两份真机数据标定）──────────
 v1（绝对 dB 线性映射）被 09-08 法师 42 分钟实测会话证伪：
   Alpha/Theta dB 双双被总功率劫持（corr(α,θ)=+0.98、corr(总功率,α)=+0.98），
   伪迹一来两者同涨——画面成了"幅度镜子"，定/躁/沉无法区分；且 v1 theta
   上限 16.62 dB 远低于实测 p95=36.54，80% 帧顶格。
 v2 改用对总功率不敏感的相对量：
   S.a ← relα = Alpha功率/五频段总功率（0~1占比；躁动时 beta/gamma 涌入
         分母，relα 下降 → 变暗；安定时上升 → 变亮）
   S.th ← log10(θ/β)（沉掉轴：高=昏沉慢波主导，低=躁动快波主导；
         粒子速度与雾浓度随 θ/β 比，不再随幅度）
 relα 区间标定史：
   v2.0（09-06）p5/p95：lo=0.0303 span=0.0582（baseline 帧×3 加权，防伪迹数据主导）
   v2.1（09-10）q1/q3：lo=0.0306 span=0.0119 ← 当前生效
     缘由：两段真机（22min+42min）实测 relα 中位仅 0.035，正落在 v2.0 区间下沿，
     致使 S.a 长期贴底 0.08（量程底部 8%）——水面辉光/粒子透明度/光球亮度分量
     全进死区，脑电闭环的视觉反馈实质失效（详见 output\20260910_VR标准模板三重
     分析\三重分析报告.md 第 4 节）。改 q1/q3 后：q1→S.a=0、中位→≈0.37、q3→1.0，
     日常状态画面从"近黑静水"变为"有呼吸感的活水"。
     代价：span 收窄到 0.0119，q3=0.0424 即触顶，p95=0.0734 以上会长时间顶格——
     最灵敏但易饱和。若实机观感"太容易满亮"，退一档改回 p5/p95（lo=0.0253
     span=0.0480，中位→S.a≈0.202）。
   log10(θ/β) 维持 v2.0：lo=-0.8198 span=1.2105（实测 S.th 中位 0.579、
     IQR 0.419~0.741，居中且分布充分，雾/粒子通路标定健康，无需重标定）。
 解耦验证：合并 corr(relα, logθβ)=+0.30（v1 为 +0.94）；干净数据 A 内 +0.54，
 含伪迹 B 内 +0.23。标定与验证脚本：b2_mapping_v2.py（report\b2_mapping_v2.json）
 语义方向（待法师审定，见工作日志 008 遗留）：安定=亮；昏沉=暗而粒子快雾浓；
 躁动=暗而慢。注意与 v1 体感（"散乱变亮变快"）方向相反——v1 那个实为伪迹镜像。 */
/* ── 截图自检注入开关（2026-09-10，三重分析用）───────────────────────
   仅当 URL 带 fix_a/fix_th/breath/autoload/wt/state 参数时生效；
   默认全部关闭——法师日常使用与 V1 标准模板（tag vr-scene-v1-template）零影响。
   用途：把 S.a/S.th/呼吸相位/水面时间/主题状态精确钉住，供无头浏览器截图做
   「参数 ↔ 视觉」对照；参数随 URL 记录，截图可复现、可对账。 */
const _qp = new URLSearchParams(location.search);
const INJ = {
  active: _qp.has('fix_a') || _qp.has('fix_th'),
  a: parseFloat(_qp.get('fix_a')) || 0,
  th: parseFloat(_qp.get('fix_th')) || 0,
  breath: _qp.has('breath') ? parseFloat(_qp.get('breath')) : null,
  wt: _qp.has('wt') ? parseFloat(_qp.get('wt')) : null,
  state: _qp.get('state') || null,
  autoload: _qp.get('autoload') === '1',
  loaded: false,
};
/* ── 沉掉轴 S.th 标定（v2.0 维持）───────────────────────
   实测中位 0.579、IQR 0.419~0.741，居中健康，无需重标定。
   （relALo/relASpan/relAFallback 已移除：安定度改走 ALGO 滚动分位，见下） */
const CAL = {
  ltBLo: -0.8198, ltBSpan: 1.2105,      // S.th ← log10(theta/beta)
  ltBFallback: -0.20                    // 无数据时中性 → S.th≈0.51
};

/* ── 状态标准 ALGO：因果滚动分位数（H-A′）───────────────
   2026-09-11 依法师裁定2（个人基线自适应）实现，经三段真机验证后移植。

   为何弃用静态标定：rel_alpha 绝对水平跨场次漂移大——同一人三场在旧标定下
   触顶率 30.7%/11.9%/43.1%、触底 2.5%/22.4%/8.8%，任何固定区间都无法同时
   适配（A段单调降21.9%、C段倒U型冲高、B段开场被伪迹污染）。
   改用「当前值在本次会话已见历史中的分位排名」：中位≈0.5 由构造保证、
   量程随个人波动自适应、结构上不存在触顶触底。

   验证结果（algo_verify_2s.py，按前端真实节奏 10秒窗/2秒步进）：
     三段触顶触底全 0.0%，|ΔS.a|p90 ≤0.0046，max jump 0.0205
     对照旧 q1q3：max jump 0.2874（差 14 倍）→ 即法师实测所见"闪、跳跃"
   ⚠️ 损失投影诚实：分位排名使"中位/IQR"两项验收由构造必然满足、无判别力，
      不得据数值全绿宣称达标；最终判定权在法师实机体感。 */
const ALGO = {
  shortSec: 60,     // 短窗：60 秒滚动中位数（当前状态）
  histSec: 300,     // 历史窗 5 分钟。验证三档（5/10/15分）全过，5分最居中
  tau: 12,          // EMA 时间常数（裁定6默认；源数据 2s 周期的 6 倍）
  warmSec: 90,      // 预热期：前 90 秒落中性不出数（判语009 不当场评分）
  noiseBg: 0.65,    // 噪声门＝report_generator.NOISE_BG_RATIO（复用既有阈值，不自建）
  minHist: 15       // 历史至少 15 值（约 30 秒）才出分位，否则中性
};
/* 窗口一律按【时间秒】定义，不按个数——后端每 2 秒出新值（BP_EPOCH_SEC=10、
   last_bp_time<2.0 则跳过），若按个数定义会与离线验证口径不符（曾险致
   历史窗缩成 1/2.5，见 algo_verify_2s.py 头部说明）。 */
const RA = { raw: [], lastSig: null };   // lastSig：bands 去重签名（后端2秒才出新值）

/* ── 数据接入：WebSocket ─────────────────────────────── */
/* https 页面自动走 wss（WebXR 要求安全上下文，Pico 进 VR 必经 HTTPS） */
const wsURL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/vr`;
let ws, retry = 0;

/* ── H-A′ 实现：因果滚动分位数 ─────────────────────────
   与 algo_verify_2s.py 的 runq_time 同构，逐项对应以便回归比对。 */
function median(a){
  if(!a.length) return NaN;
  const s = a.slice().sort((x,y)=>x-y), m = s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
/** 推入一个新 rel_alpha 样本，返回因果滚动分位 S.a（0..1）。
 *  与 algo_verify_2s.py 的 runq_time 逐项对应；未就绪时返回 0.5 中性
 *  （对应 Python 的 s_val=np.full(n,0.5)，不可返回 null 否则画面失驱动）。 */
function pushRA(t, ra, noise){
  RA.raw.push({t, v:ra, n:!!noise});
  // 只保留历史窗内的样本，防长会话内存增长
  const cut = t - ALGO.histSec;
  while(RA.raw.length && RA.raw[0].t < cut) RA.raw.shift();

  // 窗内取值：优先剔噪声，不足 3 个则退回全窗（对应 Python roll_med_time）
  const vals = (from, to) => {
    const all = RA.raw.filter(x=>x.t>=from && x.t<=to);
    const good = all.filter(x=>!x.n).map(x=>x.v);
    return good.length>=3 ? good : all.map(x=>x.v);
  };

  // ① 短窗中位（60秒）—— 当前状态（对应 Python short）
  const cur = median(vals(t - ALGO.shortSec, t));
  if (!isFinite(cur)) return 0.5;
  if (t < ALGO.warmSec) return 0.5;                 // 预热期→中性（判语009 不当场评分）

  // ② 历史短窗中位序列，**剔除噪声点**（对应 Python hist[~hz]）
  const hist = [];
  for (const p of RA.raw){
    if (p.n) continue;
    const m = median(vals(p.t - ALGO.shortSec, p.t));
    if (isFinite(m)) hist.push(m);
  }
  if (hist.length < ALGO.minHist) return 0.5;       // 历史不足→中性

  // ③ 分位排名：当前值在历史中的位置 → 0..1
  let le = 0;
  for (const h of hist) if (h <= cur) le++;
  return le/hist.length;
}
function connect(){
  ws = new WebSocket(wsURL);
  ws.onopen  = ()=>{ S.connected = true; retry = 0; $('load').style.display='none'; say('已连接控制台'); };
  ws.onclose = ()=>{ S.connected = false; say('连接断开，3 秒后重试…');
                     setTimeout(connect, 3000); };
  ws.onmessage = e => { let d; try{ d = JSON.parse(e.data); }catch{ return; }
    if(d.type==='vr_connected'||d.type==='pong') return;
    if(d.type==='tick'){
      S.source = d.source; S.elapsed = d.elapsed||0;
      S.state = d.state||S.state; S.phase = d.phase||'';
      if(d.bands) S.bands = d.bands;
      if(d.vitals) S.vitals = d.vitals;
      // v2.2 映射：S.a←因果滚动分位（H-A′，已验证），S.th←log10(θ/β) 沉掉轴
      // （绝对 dB 会被伪迹总功率劫持；bands 值为 4 通道 dB 均值）
      const B = S.bands;
      let ra = null, lt = CAL.ltBFallback, noise = false;
      if (B && B.alpha != null && B.theta != null && B.beta != null) {
        const p = k => (B[k] != null ? Math.pow(10, B[k]/10) : 0);
        const tot = p("delta")+p("theta")+p("alpha")+p("beta")+p("gamma");
        if (tot > 0) ra = p("alpha")/tot;
        lt = (B.theta - B.beta)/10;                       // = log10(theta/beta)
        // 噪声门＝report_generator.NOISE_BG_RATIO（复用既有阈值，不自建）
        noise = tot > 0 && (p("beta")+p("gamma"))/tot > ALGO.noiseBg;
      }
      // 后端每 2 秒才重算一次频段（BP_EPOCH_SEC=10、间隔<2.0s 跳过），
      // 而 tick 每 0.25 秒到一次 → 按 bands 签名去重，只在真出新值时推样本，
      // 否则同值会被重复计入历史窗，使 minHist/histSec 语义错位。
      if (ra != null) {
        const sig = `${B.alpha.toFixed(3)}|${B.beta.toFixed(3)}`;
        if (sig !== RA.lastSig) {
          RA.lastSig = sig;
          S.aTarget = pushRA(S.elapsed, ra, noise);
        }
      }
      // EMA 在主循环按真实 dt 做（tick 有抖动，此处做会与验证脚本 τ 不等价）
      const th = clamp01((lt - CAL.ltBLo)/CAL.ltBSpan);
      S.thTarget = th;
      S.hr = S.vitals.hr || 0;
    } else if(d.type==='start'||d.type==='baseline_locked'){
      say(d.type==='start' ? `实验开始：${d.tag||''}` : '基线已锁定');
    } else if(d.type==='end'){ say('会话结束'); }
    else if(d.type==='error'){ say('错误：'+(d.text||'')); }
  };
}
function clamp01(v){ return Math.max(0, Math.min(1, v)); }
connect();

/* ── 3D 模型载入（本机素材） ─────────────────────────── */
async function loadModel(){
  try{
    if(!S.modelList.length){
      const r = await fetch('/api/vr/models'); S.modelList = (await r.json()).models||[];
    }
    if(!S.modelList.length){ saySticky('本机暂无 3D 模型素材'); return; }
    // 选体积最小的一个先试（首屏快），后续可在控制台扩展选择
    S.modelList.sort((x,y)=>x.size_mb-y.size_mb);
    const pick = S.modelList[0];
    say(`载入模型 ${pick.name}（${pick.size_mb}MB）…`);
    let lastPct = -1;
    const onProg = ev => {
      if(ev.lengthComputable){
        const pct = Math.round(ev.loaded/ev.total*100);
        if(pct - lastPct >= 10 || pct === 100){
          lastPct = pct;
          say(`下载模型中 ${pct}%（${(ev.loaded/1e6).toFixed(1)}/${pick.size_mb}MB）…`);
        }
      } else {
        say(`下载模型中 ${(ev.loaded/1e6).toFixed(1)}MB…`);
      }
    };
    const g = await new GLTFLoader().loadAsync(
      `/api/vr/model?name=${encodeURIComponent(pick.name)}`, onProg);
    if(S.model) scene.remove(S.model);
    S.model = g.scene;
    // 归一化到 3 米高、置于水面之上
    const box = new THREE.Box3().setFromObject(S.model);
    const size = box.getSize(new THREE.Vector3());
    const k = 3/Math.max(size.y, 1e-6);
    S.model.scale.setScalar(k);
    const c = box.getCenter(new THREE.Vector3()).multiplyScalar(k);
    S.model.position.set(-c.x, -box.min.y*k, -c.z - 6);
    scene.add(S.model);
    say('模型已载入');
  }catch(err){ saySticky('模型载入失败：'+(err && err.message ? err.message : err)); }
}
$('btnModel').onclick = loadModel;
if(INJ.autoload) loadModel();   // 截图自检：自动载入3D模型，复现法师实机场景（仅URL带autoload=1生效）

/* ── VR 进入 ─────────────────────────────────────────── */
$('btnVR').onclick = async ()=>{
  if(!navigator.xr){ say('当前浏览器不支持 WebXR（请用 Pico 浏览器打开本页）'); return; }
  try{
    const session = await navigator.xr.requestSession('immersive-vr',
      {optionalFeatures:['local-floor']});
    renderer.xr.setSession(session);
    $('btnVR').classList.add('on'); $('btnVR').textContent = '已在 VR 中';
    hud.style.display = 'none'; $('bar').style.display='none';
    session.addEventListener('end', ()=>{
      $('btnVR').classList.remove('on'); $('btnVR').textContent='进入 VR';
      hud.style.display=''; $('bar').style.display='';
    });
  }catch(err){ say('进入 VR 失败：'+err.message); }
};
$('btnTheme').onclick = ()=>{ S.autoTheme = !S.autoTheme;
  $('btnTheme').classList.toggle('on', S.autoTheme); };

/* ── 主循环 ──────────────────────────────────────────── */
const clock = new THREE.Clock();
let breath = 0;
renderer.setAnimationLoop(()=>{
  const dt = clock.getDelta(), t = clock.elapsedTime;
  /* EMA 平滑：连续形式 1-exp(-dt/τ)，与帧率无关（VR 90fps 与桌面 60fps 同效）。
     在 dt=0.25s 时与验证脚本 algo_verify_2s.py 的 a=TICK_SEC/τ 相差约 1%，物理等价。
     这是"连绵不闪"的关键：τ=12s 是源数据 2s 周期的 6 倍（验证 τ≥10s 要求）。
     INJ 注入态跳过平滑、直接钉住，保证受控截图可复现。 */
  if(!INJ.active){
    const k = 1 - Math.exp(-Math.min(dt, 0.5)/ALGO.tau);   // dt 上限防切后台回来暴冲
    S.a  += (S.aTarget  - S.a )*k;
    S.th += (S.thTarget - S.th)*k;
  } else { S.a = INJ.a; S.th = INJ.th; if(INJ.state) S.state = INJ.state; }  // 截图自检：钉住参数（仅 URL 带参生效）
  waterU.uT.value = (INJ.active && INJ.wt!=null) ? INJ.wt : t*0.4; waterU.uA.value = S.a; waterU.uTh.value = S.th;  // 水面动画放慢到40%（原速波纹/网格光点移动过快，干扰禅修）

  if(S.autoTheme){
    const th = themeFor(S.state);
    curCol.lerp(new THREE.Color(th.col), .04);
    sky.material.uniforms.uTop.value.lerp(new THREE.Color(th.top), .04);
    sky.material.uniforms.uBot.value.lerp(new THREE.Color(th.bot), .04);
  }
  waterU.uCol.value.copy(curCol);
  sky.material.uniforms.uGlow.value = .2 + .8*S.a;
  scene.fog.density = .020 + .030*S.th;
  pMat.opacity = .35 + .55*S.a;
  pMat.color.copy(curCol).lerp(new THREE.Color(0xffffff), .35);

  // 心息之珠：脉动跟随心率但整体放慢到禅修节律（09-10法师实测原速过快干扰入定）
  const rate = S.hr>40 ? S.hr/60*0.1 : 0.08;  // 禅修节律：脉动放慢到约5-8次/分（原跟心率达75次/分，干扰入定）
  breath = (INJ.active && INJ.breath!=null) ? INJ.breath : breath + dt*rate*Math.PI*2;
  const s = Math.sin(breath);            // 呼吸相位 -1..1
  const inhale = (s + 1) * 0.5;          // 0..1，1=吸气顶点
  const pulse = 1.0 + 0.20*s;            // 呼吸胀缩幅度±20%（法师：±12%太小看不出）
  orb.scale.setScalar(0.6 * pulse);      // 整体缩小到约0.6倍（法师：球太大）；球小后±20%前表面仍只位移~7cm，不会回到"前后移动"感
  // 光色随呼吸：呼气=状态主色 curCol，吸气=过渡到亮青白（法师：加光色随呼吸变化）
  orb.material.emissive.copy(curCol).lerp(new THREE.Color(0xbfeaff), 0.55*inhale);
  // 亮度随呼吸明显起伏：吸气更亮（法师：原亮度变化不明显——此前只随缓慢的脑电S.a变，不随呼吸）
  orb.material.emissiveIntensity = 0.7 + 1.7*inhale + 0.7*S.a;

  // 粒子缓慢上升漂移（Theta 越快越"散"）
  const pos = pGeo.attributes.position;
  for(let i=0;i<PN;i++){
    let y = pos.getY(i) + dt*(.02 + .12*S.th*pSeedAt(i));  // 放慢粒子上升漂移（原速干扰禅修）
    if(y>5.5) y = .2;
    pos.setY(i,y);
  }
  pos.needsUpdate = true;

  // 桌面模式镜头轻微呼吸
  if(!renderer.xr.isPresenting){
    camera.position.y = 1.6 + .05*Math.sin(breath*.5);
    camera.lookAt(0,1.4,-1.6);
  }

  // HUD（桌面）
  if(!renderer.xr.isPresenting){
    hud.innerHTML =
      `<b>状态</b> ${S.state||'—'} ${S.phase?('· '+S.phase):''}<br>`+
      `<b>Alpha</b> ${fmt(S.bands.alpha)} dB　<b>Theta</b> ${fmt(S.bands.theta)} dB<br>`+
      `<b>心率</b> ${S.hr?Math.round(S.hr)+' bpm':'—'}　<b>时长</b> ${S.elapsed|0}s<br>`+
      `<b>数据源</b> ${S.connected?(S.source||'已连接'):'未连接控制台'}`+
      (INJ.active?`<br><b style="color:#ffd43b">注入</b> S.a=${INJ.a} S.th=${INJ.th}`+
        (INJ.breath!=null?` 呼吸=${INJ.breath.toFixed(2)}`:'')+
        (INJ.state?` 态=${INJ.state}`:'')+(INJ.wt!=null?` wt=${INJ.wt}`:''):'');
  }
  if(msgT && Date.now()-msgT>5000){ msg.textContent=''; msgT=0; }
  renderer.render(scene,camera);
  if(firstFrame){ firstFrame=false; $('load').style.display='none'; }
});
let firstFrame = true;
function pSeedAt(i){ return pSeed[i]; }
function fmt(v){ return (v==null||isNaN(v))?'—':(+v).toFixed(1); }

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
<script>
/* 看门狗：8 秒仍停在加载层则展示失败原因 */
setTimeout(function(){
  var l = document.getElementById('load');
  if(l && l.style.display !== 'none'){
    l.textContent = '加载异常：' + (window.__vrErr || '3D 引擎未能初始化');
    l.style.color = '#ff9d9d';
  }
}, 8000);
</script>
