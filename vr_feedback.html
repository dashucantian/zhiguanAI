<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>止观 · VR 视觉反馈</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1d33">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#050a10;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#cfe3ee}
  #hud{position:fixed;left:16px;top:14px;z-index:10;font-size:13px;line-height:1.7;
       background:rgba(6,14,22,.55);padding:10px 14px;border-radius:10px;backdrop-filter:blur(6px);max-width:46vw}
  #hud b{color:#7fd8ff}
  #bar{position:fixed;left:16px;bottom:14px;z-index:10;display:flex;gap:8px;flex-wrap:wrap}
  button{background:#123246;color:#bfe6f7;border:1px solid #2b5a74;border-radius:8px;
         padding:8px 14px;font-size:13px;cursor:pointer}
  button:hover{background:#1a4560}
  button.on{background:#0f6a52;border-color:#2ea98a;color:#e6fff6}
  #msg{position:fixed;right:16px;top:14px;z-index:10;font-size:12px;color:#8fb4c6;text-align:right;max-width:40vw}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:#050a10;z-index:20;font-size:15px;letter-spacing:2px}
</style>
</head>
<body>
<div id="load">止观 · 正在建立反馈回路 …</div>
<script>
/* 诊断钩子：模块加载/初始化失败时把原因写进页面，便于无头环境定位 */
window.__vrErr = '';
addEventListener('error', e => { window.__vrErr = (e.message||'') + ' @' + (e.filename||'') + ':' + (e.lineno||''); });
addEventListener('unhandledrejection', e => { window.__vrErr = 'rejection: ' + (e.reason && e.reason.message || e.reason); });
</script>
<div id="hud"></div>
<div id="msg"></div>
<div id="bar">
  <button id="btnVR">进入 VR</button>
  <button id="btnModel">载入禅修场景模型</button>
  <button id="btnTheme" class="on">自动配色</button>
  <button id="btnSound">声音：关</button>
  <button id="btnMeditation">冥想引导</button>
</div>
<script type="importmap">
{"imports":{
  "three":"/vr_assets/three.module.js",
  "three/addons/":"/vr_assets/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

/* ── 状态 ─────────────────────────────────────────────── */
const S = {
  connected:false, source:null, elapsed:0, state:'', phase:'',
  bands:{}, vitals:{},
  a:0.5, th:0.5, hr:0,              // 平滑后的视觉参数 0..1 / bpm（初值0.5＝中性）
  aTarget:0.5, thTarget:0.5,        // EMA 目标值（每 2 秒由新 bands 更新一次）
  autoTheme:true, model:null, modelList:[], modelBox:null,   // modelBox：模型世界坐标包围盒（粒子避让用）
  // ── 声音（裁定5：本轮接入、默认静音）─────────────
  // beat/vol 由后端 closedloop_controller 决策（监测路径 09-11 起才透传），
  // 前端只负责渲染，不自建决策逻辑（红线5）。
  beat:null, vol:0, audioPhase:'idle',   // 后端指令
  soundOn:false,                         // 法师开关，默认 false（静音）
  // ── 冥想引导（2026-09-15 法师指示接入）─────────────
  meditationOn:false,                    // 冥想引导开关
  meditationVideo:null,                  // 视频屏幕对象
  meditationAudio:null                   // 音频播放器
};
const $ = id => document.getElementById(id);
const hud = $('hud'), msg = $('msg');
let msgT = 0;
function say(t){ msg.textContent = t; msgT = Date.now(); }
function saySticky(t){ msg.textContent = t; msgT = Infinity; }  // 错误等需常驻的提示

/* ── 渲染器 / 场景 ────────────────────────────────────── */
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true});
}catch(err){
  document.getElementById('load').innerHTML =
    '本环境无法初始化 WebGL 3D 渲染：<br>' + (err && err.message ? err.message : err) +
    '<br><span style="font-size:12px;color:#8fb4c6">请在 Pico 浏览器或带 GPU 的桌面浏览器打开本页</span>';
  document.getElementById('load').style.color = '#ff9d9d';
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1622, 0.028);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 300);
camera.position.set(0,1.6,3.2);

scene.add(new THREE.HemisphereLight(0x9fc6e8, 0x10202c, 0.55));
const sun = new THREE.DirectionalLight(0xffd9a8, 0.9);
sun.position.set(4,6,2); scene.add(sun);

/* 天穹渐变 */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(120,32,20),
  new THREE.ShaderMaterial({side:THREE.BackSide, uniforms:{
    uTop:{value:new THREE.Color(0x0b1d33)}, uBot:{value:new THREE.Color(0x37233a)}, uGlow:{value:0.3}},
    vertexShader:`varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vP; uniform vec3 uTop,uBot; uniform float uGlow;
      void main(){float h=normalize(vP).y*.5+.5;
        vec3 c=mix(uBot,uTop,smoothstep(.05,.75,h));
        c+=vec3(.9,.55,.3)*pow(max(0.,1.-abs(h-.16)*4.),3.)*uGlow*.6;
        gl_FragColor=vec4(c,1.);}`
  }));
scene.add(sky);

/* 水面：脑电驱动涟漪与辉光 */
const waterU = {uT:{value:0}, uA:{value:.3}, uTh:{value:.3}, uCol:{value:new THREE.Color(0x2f8fb8)}};
const water = new THREE.Mesh(new THREE.CircleGeometry(40,96),
  new THREE.ShaderMaterial({uniforms:waterU,
    vertexShader:`varying vec2 vUv; varying vec3 vP;
      uniform float uT,uA,uTh;
      void main(){vUv=uv; vec3 p=position;
        float r=length(p.xy);
        p.z += sin(r*1.6-uT*0.5)*(.05+.16*uA) + sin(p.x*.8+uT*0.3)*.03*uTh;
        vP=p; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
    fragmentShader:`varying vec2 vUv; varying vec3 vP; uniform float uT,uA,uTh; uniform vec3 uCol;
      void main(){float r=length(vUv-.5)*2.;
        float ring=.5+.5*sin(r*22.-uT*0.55);
        vec3 c=mix(uCol*.25,uCol,(.25+.75*uA)*ring*smoothstep(1.,.15,r));
        c+=uCol*pow(max(0.,1.-r*1.15),3.)*(.35+.9*uA);
        c+=vec3(.6,.8,1.)*uTh*.06*sin(vUv.x*60.+uT*0.45);
        gl_FragColor=vec4(c,1.);}`
  }));
water.rotation.x = -Math.PI/2; scene.add(water);

/* 冥想引导视频屏幕（2026-09-15 法师指示接入）─────────────
   位于用户左前方，半透明显示，不干扰主场景。
   视频循环播放（10秒视频配17分钟音频），与音频同步。 */
const meditationVideoEl = document.createElement('video');
meditationVideoEl.src = '/vr_assets/meditation_video.mp4';
meditationVideoEl.loop = true;
meditationVideoEl.muted = true;  // 视频静音，音频单独播放
meditationVideoEl.playsInline = true;
meditationVideoEl.crossOrigin = 'anonymous';
const meditationVideoTexture = new THREE.VideoTexture(meditationVideoEl);
meditationVideoTexture.minFilter = THREE.LinearFilter;
meditationVideoTexture.magFilter = THREE.LinearFilter;
const meditationScreen = new THREE.Mesh(
  new THREE.PlaneGeometry(1.6, 0.9),  // 16:9 比例
  new THREE.MeshBasicMaterial({
    map: meditationVideoTexture,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide
  })
);
meditationScreen.position.set(-2.5, 1.8, -2);  // 左前方，眼睛高度
meditationScreen.rotation.y = Math.PI / 6;  // 稍微转向用户
meditationScreen.visible = false;  // 默认隐藏
scene.add(meditationScreen);

/* 冥想引导音频播放器 */
const meditationAudioEl = document.createElement('audio');
meditationAudioEl.src = '/vr_assets/meditation_guide.mp3';
meditationAudioEl.loop = false;  // 17分钟音频不循环
meditationAudioEl.preload = 'auto';

/* 心息之珠：随心率/呼吸脉动 */
const orb = new THREE.Mesh(new THREE.SphereGeometry(.28,48,32),
  new THREE.MeshStandardMaterial({color:0x8fd8ff, emissive:0x2a7fa8,
    emissiveIntensity:1.2, roughness:.25, metalness:.1}));
orb.position.set(0,1.25,-1.4); scene.add(orb);  // 固定在观者(z=3.2)与本尊模型(z≈-6)的中点 z=-1.4；y=胸口高度（09-10法师实测：往复移动干扰禅修，改为定点呼吸胀缩）

/* 念珠粒子：Theta 驱动漂移 */
const PN = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PN*3), pSeed = new Float32Array(PN);
for(let i=0;i<PN;i++){
  const r = 2+Math.random()*14, a = Math.random()*Math.PI*2;
  pPos[i*3]=Math.cos(a)*r; pPos[i*3+1]=.2+Math.random()*5; pPos[i*3+2]=Math.sin(a)*r;
  pSeed[i]=Math.random();
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('seed', new THREE.BufferAttribute(pSeed,1));
const pMat = new THREE.PointsMaterial({color:0xbfe8ff,size:.06,transparent:true,
  opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(pGeo,pMat));

/* ── 状态 → 配色 ──────────────────────────────────────── */
const THEMES = {
  calm:   {col:0x3fae8c, top:0x0a2430, bot:0x24343a},
  focused:{col:0x3f8fae, top:0x0b1d33, bot:0x2a2f44},
  drowsy: {col:0x7a6fae, top:0x141026, bot:0x2e2438},
  active: {col:0xae7a4f, top:0x241408, bot:0x3a2a1e},
  default:{col:0x2f8fb8, top:0x0b1d33, bot:0x37233a},
};
function themeFor(state){
  const s=(state||'').toString();
  if(s.includes('静')||s.includes('calm')) return THEMES.calm;
  if(s.includes('专注')||s.includes('focus')) return THEMES.focused;
  if(s.includes('昏')||s.includes('睡')||s.includes('drow')) return THEMES.drowsy;
  if(s.includes('动')||s.includes('散')||s.includes('active')) return THEMES.active;
  return THEMES.default;
}
let curCol = new THREE.Color(THEMES.default.col);

/* ── 底色层配置（四维分工·维度1）────────────────────
   底色 = 状态色调/空间氛围，应是四要素中**最慢**的一层（分钟级），
   持续存在、不抢注意——即法师要求的"使其成为底色"。
   原实现 curCol.lerp(..., .04) 是每帧固定系数：
     - 60fps 下 τ≈0.41 秒，比中程 S.a（τ=12s）还快 30 倍 → **分工错位**
     - 帧率相关：VR 90fps 下过渡快 1.5 倍，与桌面不一致 → **bug**
       （同一问题已在 EMA 处用 1-exp(-dt/τ) 修掉，主题色此前漏改）
     - state 在分类阈值附近抖动时，色调会频繁快速跳变 → 潜在闪源
   改法：帧率无关连续形式 + τ=60s，使色调缓慢流淌成真正底色。
   Color 对象缓存复用：原写法每帧 new THREE.Color×3，VR 90fps 下
   每秒 270 次分配造成 GC 压力（改这行顺带修，不扩大范围）。 */
const THEME = { tau: 60 };
const _cCol = new THREE.Color(), _cTop = new THREE.Color(), _cBot = new THREE.Color();

/* ── 频段 → 画面 映射 v2（2026-09-08 凌晨，经两份真机数据标定）──────────
 v1（绝对 dB 线性映射）被 09-08 法师 42 分钟实测会话证伪：
   Alpha/Theta dB 双双被总功率劫持（corr(α,θ)=+0.98、corr(总功率,α)=+0.98），
   伪迹一来两者同涨——画面成了"幅度镜子"，定/躁/沉无法区分；且 v1 theta
   上限 16.62 dB 远低于实测 p95=36.54，80% 帧顶格。
 v2 改用对总功率不敏感的相对量：
   S.a ← relα = Alpha功率/五频段总功率（0~1占比；躁动时 beta/gamma 涌入
         分母，relα 下降 → 变暗；安定时上升 → 变亮）
   S.th ← log10(θ/β)（沉掉轴：高=昏沉慢波主导，低=躁动快波主导；
         粒子速度与雾浓度随 θ/β 比，不再随幅度）
 relα 区间标定史：
   v2.0（09-06）p5/p95：lo=0.0303 span=0.0582（baseline 帧×3 加权，防伪迹数据主导）
   v2.1（09-10）q1/q3：lo=0.0306 span=0.0119 ← 当前生效
     缘由：两段真机（22min+42min）实测 relα 中位仅 0.035，正落在 v2.0 区间下沿，
     致使 S.a 长期贴底 0.08（量程底部 8%）——水面辉光/粒子透明度/光球亮度分量
     全进死区，脑电闭环的视觉反馈实质失效（详见 output\20260910_VR标准模板三重
     分析\三重分析报告.md 第 4 节）。改 q1/q3 后：q1→S.a=0、中位→≈0.37、q3→1.0，
     日常状态画面从"近黑静水"变为"有呼吸感的活水"。
     代价：span 收窄到 0.0119，q3=0.0424 即触顶，p95=0.0734 以上会长时间顶格——
     最灵敏但易饱和。若实机观感"太容易满亮"，退一档改回 p5/p95（lo=0.0253
     span=0.0480，中位→S.a≈0.202）。
   log10(θ/β) 维持 v2.0：lo=-0.8198 span=1.2105（实测 S.th 中位 0.579、
     IQR 0.419~0.741，居中且分布充分，雾/粒子通路标定健康，无需重标定）。
 解耦验证：合并 corr(relα, logθβ)=+0.30（v1 为 +0.94）；干净数据 A 内 +0.54，
 含伪迹 B 内 +0.23。标定与验证脚本：b2_mapping_v2.py（report\b2_mapping_v2.json）
 语义方向（待法师审定，见工作日志 008 遗留）：安定=亮；昏沉=暗而粒子快雾浓；
 躁动=暗而慢。注意与 v1 体感（"散乱变亮变快"）方向相反——v1 那个实为伪迹镜像。 */
/* ── 截图自检注入开关（2026-09-10，三重分析用）───────────────────────
   仅当 URL 带 fix_a/fix_th/breath/autoload/wt/state 参数时生效；
   默认全部关闭——法师日常使用与 V1 标准模板（tag vr-scene-v1-template）零影响。
   用途：把 S.a/S.th/呼吸相位/水面时间/主题状态精确钉住，供无头浏览器截图做
   「参数 ↔ 视觉」对照；参数随 URL 记录，截图可复现、可对账。 */
const _qp = new URLSearchParams(location.search);

/* ── 引导模式（2026-09-12 法师裁定：打包为无脑电可用的通用场景）──────
   裁定三项：PWA 形态 + 纯引导冥想版（去脑电）+ 先本机 HTTPS(8778) 当场测。
   **单文件双模式，绝不 fork 第二份场景**（守统一架构不造冗余）：
     /vr?mode=guided → 引导版：无任何后端/传感器依赖，点开即用
     /vr             → 脑电版：行为与 V2 完全一致，零影响
   两模式共用渲染、四维分工、粒子避让、声音引擎，仅数据来源不同 ——
   以后改场景，两版一起受益，不会分叉。

   进入引导版：① URL 显式 mode=guided（PWA 的 start_url 即此）
              ② 后端不可达时自动降级（避免给出死页面） */
const GUIDED = {
  on: _qp.get('mode') === 'guided',   // 显式请求引导模式
  auto: false,                        // 后端探测失败后置 true（自动降级）
  saBase: 0.52,       // S.a 基准：水面/粒子处于中上亮度，画面"活"而不刺眼
  saAmp: 0.16,        // S.a 缓慢流转幅度 ±0.16
  saPeriod: 210,      // S.a 流转周期 210 秒（3.5 分钟，慢到只作底色呼吸）
  thBase: 0.50,       // S.th 基准（雾浓度/粒子漂移取中性）
  thAmp: 0.10,
  thPeriod: 330,      // 与 saPeriod 比值 0.636 非简单整数比 → 不产生拍频
  state: '静',        // 底色固定「安定」基调（法师要的调和/安稳/纯粹）
  beat: 10.0,         // 引导音节拍 Hz（无后端，前端自主生成）
  vol: 0.16,          // 引导音音量：可闻但不注意（底色）；仍默认静音，须点开关
};
/* 现实锚在引导版改用前端自计时：S.elapsed 由后端推送，引导版恒为 0，
   若不换源则水面永不起伏、四维中的维度4失效。 */
const GUIDED_T0 = Date.now();
function guidedElapsed(){ return (Date.now() - GUIDED_T0) / 1000; }
/** 引导模式是否生效（显式请求 或 后端不可达自动降级） */
function isGuided(){ return GUIDED.on || GUIDED.auto; }

const INJ = {
  active: _qp.has('fix_a') || _qp.has('fix_th'),
  a: parseFloat(_qp.get('fix_a')) || 0,
  th: parseFloat(_qp.get('fix_th')) || 0,
  breath: _qp.has('breath') ? parseFloat(_qp.get('breath')) : null,
  wt: _qp.has('wt') ? parseFloat(_qp.get('wt')) : null,
  state: _qp.get('state') || null,
  autoload: _qp.get('autoload') === '1',
  loaded: false,
};
/* ── 沉掉轴 S.th 标定（v2.0 维持）───────────────────────
   实测中位 0.579、IQR 0.419~0.741，居中健康，无需重标定。
   （relALo/relASpan/relAFallback 已移除：安定度改走 ALGO 滚动分位，见下） */
const CAL = {
  ltBLo: -0.8198, ltBSpan: 1.2105,      // S.th ← log10(theta/beta)
  ltBFallback: -0.20                    // 无数据时中性 → S.th≈0.51
};

/* ── 状态标准 ALGO：因果滚动分位数（H-A′）───────────────
   2026-09-11 依法师裁定2（个人基线自适应）实现，经三段真机验证后移植。

   为何弃用静态标定：rel_alpha 绝对水平跨场次漂移大——同一人三场在旧标定下
   触顶率 30.7%/11.9%/43.1%、触底 2.5%/22.4%/8.8%，任何固定区间都无法同时
   适配（A段单调降21.9%、C段倒U型冲高、B段开场被伪迹污染）。
   改用「当前值在本次会话已见历史中的分位排名」：中位≈0.5 由构造保证、
   量程随个人波动自适应、结构上不存在触顶触底。

   验证结果（algo_verify_2s.py，按前端真实节奏 10秒窗/2秒步进）：
     三段触顶触底全 0.0%，|ΔS.a|p90 ≤0.0046，max jump 0.0205
     对照旧 q1q3：max jump 0.2874（差 14 倍）→ 即法师实测所见"闪、跳跃"
   ⚠️ 损失投影诚实：分位排名使"中位/IQR"两项验收由构造必然满足、无判别力，
      不得据数值全绿宣称达标；最终判定权在法师实机体感。 */
const ALGO = {
  shortSec: 60,     // 短窗：60 秒滚动中位数（当前状态）
  histSec: 300,     // 历史窗 5 分钟。验证三档（5/10/15分）全过，5分最居中
  tau: 12,          // EMA 时间常数（裁定6默认；源数据 2s 周期的 6 倍）
  warmSec: 90,      // 预热期：前 90 秒落中性不出数（判语009 不当场评分）
  noiseBg: 0.65,    // 噪声门＝report_generator.NOISE_BG_RATIO（复用既有阈值，不自建）
  minHist: 15       // 历史至少 15 值（约 30 秒）才出分位，否则中性
};
/* 窗口一律按【时间秒】定义，不按个数——后端每 2 秒出新值（BP_EPOCH_SEC=10、
   last_bp_time<2.0 则跳过），若按个数定义会与离线验证口径不符（曾险致
   历史窗缩成 1/2.5，见 algo_verify_2s.py 头部说明）。 */
const RA = { raw: [], lastSig: null };   // lastSig：bands 去重签名（后端2秒才出新值）

/* ── 引导所缘 GUIDE（裁定4：6 次/分）──────────────────
   2026-09-11 重定位。原代码 rate = S.hr>40 ? S.hr/60*0.1 : 0.08，注释称"脉动
   跟随心率"，但实测本机无 PPG 设备：vitals.hr 初值 None、仅在 ppg_m 存在时赋值

   （eeg / eeg_pre_filter / timestamps / meta）→ S.hr 恒为 0 → 永远走 0.08 常数
   分支（固定 12.5 秒/周期）。即**注释与事实不符的虚假生理映射**（红线9）。
   法师 09-11 的质疑"它是随我的呼吸节奏实时变化的吗？但我好像看到它是一种固定
   的节奏"——观察正确。

   又实测呼吸无法从 EEG 提取（diag_breath.py：四通道呼吸峰间隔 CV=0.40~0.47，
   远超 0.25 判据；主频跨通道一致 0.156~0.172Hz 但长程能量波动 5.9 倍）
   → "测量真实呼吸"这条路不成立。

   故重定位为「引导所缘」：不是测量法师的呼吸，而是提供一个可供依止的稳定节律，
   法师的呼吸与之相应。这既守硬件事实，也合"入"相（止于所缘）本义。
   ⚠️ 边界诚实：法师 09-11 裁定的是节律值（6 次/分）；"引导所缘"这一定性属
      AI 工程推断，法师未单独明示认可。若不认可此定性，数值可保留、仅改表述。
   ZG-052 说明：法师选定固定值而非可调 UI，故做成命名常量（改一处即可），
      本轮不建运行时调节控件，避免超出授权范围。 */
const GUIDE = {
  bpm: 4,           // 法师 09-15 实测后调整：4 次/分 → 15 秒一周期（原裁定 6 次/分）
  amp: 0.20,        // 胀缩幅度 ±20%（V1 标准模板值，法师已认可）
  scale: 0.6        // 光球基准尺寸（V1 标准模板值，法师："球太大"）
};

/* ── 现实锚（四维分工·维度4）────────────────────────
   法师意图：「同时又知道自己身处在现实环境当中，这种虚实重叠感（或者叫做
   时空重叠感）所带来的张力，是它的一个主要状态基调。」
   → 需要一个**现实侧**的信号源与虚拟侧（脑电映射）并存，张力才成立。

   可用现实锚的实测筛查（详见对齐方案 §3.2）：
     真实呼吸 ❌ 不可从EEG提取（diag_breath.py：CV=0.40~0.47>0.25判据）
     心率/HRV ❌ 本机无PPG（vitals.hr恒为None/0）
     头部微动 ⏸ 裁定7暂缓（npz未存ACC，motion_xyz稳定性未实测）
     **真实会话时长 ✅** 裁定7采纳：elapsed 已推送，是确凿的现实侧量
   → 本轮用 elapsed（真实经过秒数）驱动极缓慢的环境起伏。

   ⚠️ 硬约束：**VR 下绝不动相机**。相机位移在沉浸式头显中会引发晕动症，
     且 WebXR 下相机由头显姿态接管、代码改动无效或冲突。
     故锚点落在场景元素（水面）而非相机——桌面模式的镜头呼吸保持原样不动。 */
const ANCHOR = {
  period: 300,      // 5 分钟一周期：慢到只作"时间在流"的底层暗示，不抢注意
  amp: 0.012        // 水面高度起伏 ±1.2%（约 ±0.5cm），刻意微弱成"底色"
};

/* ── 声音渲染（前端 Web Audio，裁定5：本轮接入、默认静音）─────
   为何前端渲染而非复用后端 IsoEngine：IsoEngine 走 sounddevice 输出到
   **电脑扬声器**，而法师佩戴 Pico 头显 → 声音到不了耳朵。故复用后端
   **决策层**（closedloop_controller：基线自适应→beat/vol），输出层在 VR
   路径必须由前端 Web Audio 渲染。这不是平行路径，而是同一决策、不同物理
   输出设备（红线5 禁的是重建决策逻辑，非禁必要的输出适配）。

   合成方式与 IsoEngine 逐项等价（closedloop_engine.py:_callback）：
     sig = sin(载波相位) × max(sin(节拍相位), 0)^0.6 × 限速音量
   - 载波 220Hz（同 experiment_config.json audio.carrier_hz）
   - 等时节拍包络：正弦正半周取 0.6 次幂 → 50% 占空比、过零连续无咔哒
   - 音量限速：每采样最多变 0.0002（约 9/秒满幅），防爆音
   - 相位累积：频率热更新时波形连续不跳变
   ⚠️ 需逐样本合成，只能用 AudioWorklet（ScriptProcessor 已废弃、VR 下卡顿）。
   Worklet 源码用字符串数组 join 构建、内部全用单引号——避免嵌套模板串反引号
   （2026-09-10 曾因未闭合模板串改坏实机页面，此处刻意规避）。 */
const AUDIO = {
  carrier: 220.0,       // 载波 Hz，同 experiment_config.json audio.carrier_hz
  volLimit: 0.0002,     // 每采样音量最大变化，同 IsoEngine max_step
  ctx: null, node: null, gain: null, ready: false
};
const WORKLET_SRC = [
  'class IsoProc extends AudioWorkletProcessor {',
  '  constructor(){ super();',
  '    this.phC = 0; this.phM = 0; this.cur = 0;',
  '    this.beat = 10; this.carrier = 220; this.vol = 0; this.limit = 0.0002;',
  '    this.port.onmessage = (e) => {',
  '      const d = e.data;',
  '      if (d.beat != null) this.beat = Math.max(0.5, Math.min(40, d.beat));',
  '      if (d.carrier != null) this.carrier = Math.max(50, Math.min(1500, d.carrier));',
  '      if (d.vol != null) this.vol = Math.max(0, Math.min(1, d.vol));',
  '      if (d.limit != null) this.limit = d.limit;',
  '    };',
  '  }',
  '  process(inputs, outputs){',
  '    const out = outputs[0]; if (!out || !out.length) return true;',
  '    const sr = sampleRate, n = out[0].length;',
  '    const TWO_PI = 6.283185307179586;',
  '    let pc = this.phC, pm = this.phM;',
  '    const stepC = TWO_PI * this.carrier / sr;',
  '    const stepM = TWO_PI * this.beat / sr;',
  '    for (let i = 0; i < n; i++){',
  '      const env = Math.pow(Math.max(Math.sin(pm), 0), 0.6);',
  '      let dv = this.vol - this.cur;',
  '      const mx = this.limit * n;',
  '      if (dv > mx) dv = mx; else if (dv < -mx) dv = -mx;',
  '      const vt = this.cur + dv * (i + 1) / n;',
  '      const sig = Math.sin(pc) * env * vt;',
  '      for (let ch = 0; ch < out.length; ch++) out[ch][i] = sig;',
  '      pc += stepC; pm += stepM;',
  '    }',
  '    this.cur += Math.max(-this.limit * n, Math.min(this.limit * n, this.vol - this.cur));',
  '    this.phC = pc % TWO_PI; this.phM = pm % TWO_PI;',
  '    return true;',
  '  }',
  '}',
  'registerProcessor("iso-proc", IsoProc);'
].join('\n');

async function audioInit(){
  if (AUDIO.ready) return true;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ say('本浏览器不支持 Web Audio，声音不可用'); return false; }
    AUDIO.ctx = new AC();
    if (AUDIO.ctx.state === 'suspended') await AUDIO.ctx.resume();
    // Worklet 源码用 Blob URL 内联加载：不新增静态文件、不加服务器路由
    const url = URL.createObjectURL(new Blob([WORKLET_SRC], {type:'application/javascript'}));
    await AUDIO.ctx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    AUDIO.node = new AudioWorkletNode(AUDIO.ctx, 'iso-proc');
    AUDIO.gain = AUDIO.ctx.createGain();
    AUDIO.gain.gain.value = 0;              // 默认静音（裁定5）
    AUDIO.node.connect(AUDIO.gain).connect(AUDIO.ctx.destination);
    AUDIO.ready = true;
    return true;
  }catch(err){
    say('声音初始化失败：'+(err && err.message ? err.message : err));
    return false;
  }
}
function audioPush(){
  if (!AUDIO.ready || !AUDIO.node) return;
  // 基线期（audioPhase!=='locked'）或未开启 → 目标音量 0（不出声）
  const target = (S.soundOn && S.audioPhase === 'locked' && S.beat != null)
                 ? Math.max(0, Math.min(1, S.vol || 0)) : 0;
  AUDIO.node.port.postMessage({beat: S.beat, carrier: AUDIO.carrier,
                               vol: target, limit: AUDIO.volLimit});
  if (AUDIO.gain) AUDIO.gain.gain.setTargetAtTime(S.soundOn ? 1 : 0,
                                                  AUDIO.ctx.currentTime, 0.05);
}

/* ── 数据接入：WebSocket ─────────────────────────────── */
/* https 页面自动走 wss（WebXR 要求安全上下文，Pico 进 VR 必经 HTTPS） */
const wsURL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/vr`;
let ws, retry = 0;

/* ── H-A′ 实现：因果滚动分位数 ─────────────────────────
   与 algo_verify_2s.py 的 runq_time 同构，逐项对应以便回归比对。 */
function median(a){
  if(!a.length) return NaN;
  const s = a.slice().sort((x,y)=>x-y), m = s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
/** 推入一个新 rel_alpha 样本，返回因果滚动分位 S.a（0..1）。
 *  与 algo_verify_2s.py 的 runq_time 逐项对应；未就绪时返回 0.5 中性
 *  （对应 Python 的 s_val=np.full(n,0.5)，不可返回 null 否则画面失驱动）。 */
function pushRA(t, ra, noise){
  RA.raw.push({t, v:ra, n:!!noise});
  // 只保留历史窗内的样本，防长会话内存增长
  const cut = t - ALGO.histSec;
  while(RA.raw.length && RA.raw[0].t < cut) RA.raw.shift();

  // 窗内取值：优先剔噪声，不足 3 个则退回全窗（对应 Python roll_med_time）
  const vals = (from, to) => {
    const all = RA.raw.filter(x=>x.t>=from && x.t<=to);
    const good = all.filter(x=>!x.n).map(x=>x.v);
    return good.length>=3 ? good : all.map(x=>x.v);
  };

  // ① 短窗中位（60秒）—— 当前状态（对应 Python short）
  const cur = median(vals(t - ALGO.shortSec, t));
  if (!isFinite(cur)) return 0.5;
  if (t < ALGO.warmSec) return 0.5;                 // 预热期→中性（判语009 不当场评分）

  // ② 历史短窗中位序列，**剔除噪声点**（对应 Python hist[~hz]）
  const hist = [];
  for (const p of RA.raw){
    if (p.n) continue;
    const m = median(vals(p.t - ALGO.shortSec, p.t));
    if (isFinite(m)) hist.push(m);
  }
  if (hist.length < ALGO.minHist) return 0.5;       // 历史不足→中性

  // ③ 分位排名：当前值在历史中的位置 → 0..1
  let le = 0;
  for (const h of hist) if (h <= cur) le++;
  return le/hist.length;
}
function connect(){
  ws = new WebSocket(wsURL);
  ws.onopen  = ()=>{ S.connected = true; retry = 0; $('load').style.display='none'; say('已连接控制台'); };
  ws.onclose = ()=>{ S.connected = false; say('连接断开，3 秒后重试…');
                     setTimeout(connect, 3000); };
  ws.onmessage = e => { let d; try{ d = JSON.parse(e.data); }catch{ return; }
    if(d.type==='vr_connected'||d.type==='pong') return;
    if(d.type==='tick'){
      S.source = d.source; S.elapsed = d.elapsed||0;
      S.state = d.state||S.state; S.phase = d.phase||'';
      if(d.bands) S.bands = d.bands;
      if(d.vitals) S.vitals = d.vitals;
      // v2.2 映射：S.a←因果滚动分位（H-A′，已验证），S.th←log10(θ/β) 沉掉轴
      // （绝对 dB 会被伪迹总功率劫持；bands 值为 4 通道 dB 均值）
      const B = S.bands;
      let ra = null, lt = CAL.ltBFallback, noise = false;
      if (B && B.alpha != null && B.theta != null && B.beta != null) {
        const p = k => (B[k] != null ? Math.pow(10, B[k]/10) : 0);
        const tot = p("delta")+p("theta")+p("alpha")+p("beta")+p("gamma");
        if (tot > 0) ra = p("alpha")/tot;
        lt = (B.theta - B.beta)/10;                       // = log10(theta/beta)
        // 噪声门＝report_generator.NOISE_BG_RATIO（复用既有阈值，不自建）
        noise = tot > 0 && (p("beta")+p("gamma"))/tot > ALGO.noiseBg;
      }
      // 后端每 2 秒才重算一次频段（BP_EPOCH_SEC=10、间隔<2.0s 跳过），
      // 而 tick 每 0.25 秒到一次 → 按 bands 签名去重，只在真出新值时推样本，
      // 否则同值会被重复计入历史窗，使 minHist/histSec 语义错位。
      if (ra != null) {
        const sig = `${B.alpha.toFixed(3)}|${B.beta.toFixed(3)}`;
        if (sig !== RA.lastSig) {
          RA.lastSig = sig;
          S.aTarget = pushRA(S.elapsed, ra, noise);
        }
      }
      // EMA 在主循环按真实 dt 做（tick 有抖动，此处做会与验证脚本 τ 不等价）
      const th = clamp01((lt - CAL.ltBLo)/CAL.ltBSpan);
      S.thTarget = th;
      S.hr = S.vitals.hr || 0;
      // 声音指令（后端 closedloop_controller 决策，监测路径 09-11 起才透传）
      if (d.beat != null) S.beat = d.beat;
      if (d.vol != null) S.vol = d.vol;
      if (d.audio_phase) S.audioPhase = d.audio_phase;
      audioPush();
    } else if(d.type==='start'||d.type==='baseline_locked'){
      say(d.type==='start' ? `实验开始：${d.tag||''}` : '基线已锁定');
      if(d.type==='baseline_locked') S.audioPhase = 'locked';   // 基线锁定后可出声
    } else if(d.type==='end'){ say('会话结束'); }
    else if(d.type==='error'){ say('错误：'+(d.text||'')); }
  };
}
function clamp01(v){ return Math.max(0, Math.min(1, v)); }

/* ── 引导模式：自主生成 S.a/S.th（不依赖任何后端与传感器）──
   用两条互质周期的正弦叠加，让画面"活"起来但不构成可预测的机械循环。
   周期 210s / 330s 比值 0.636，非简单整数比 → 不产生拍频（对齐方案 §3.2 要求）。
   注意：这里产出的是 **慢变量**，仍走主循环同一套 EMA（τ=12s），
   故与脑电版共享同一平滑链路，视觉质感一致。 */
function guidedUpdate(sec){
  S.aTarget = clamp01(GUIDED.saBase
    + GUIDED.saAmp * Math.sin(sec / GUIDED.saPeriod * Math.PI * 2)
    + GUIDED.saAmp * 0.35 * Math.sin(sec / 97 * Math.PI * 2 + 1.7));
  S.thTarget = clamp01(GUIDED.thBase
    + GUIDED.thAmp * Math.sin(sec / GUIDED.thPeriod * Math.PI * 2 + 0.8));
  S.state = GUIDED.state;              // 底色固定「安定」
  S.elapsed = sec;                     // 现实锚改用前端自计时（见 GUIDED_T0 注释）
  // 声音：引导版无后端决策器，前端自主给固定引导音参数；
  // audioPhase 置 'locked' 使 audioPush 放行（仍受 soundOn 总开关控制，默认静音）
  S.beat = GUIDED.beat; S.vol = GUIDED.vol; S.audioPhase = 'locked';
}
/* 诊断探针（与 INJ/__vrDiag 同类测试设施）：模块作用域变量 CDP 取不到，
   主动挂 window 供实测核验 S.a 是否真在自主流转、以及当前处于哪种模式。 */
window.__vrSaProbe = () => S.a;
window.__vrMode = () => ({guided: isGuided(), on: GUIDED.on, auto: GUIDED.auto,
                          aTarget: S.aTarget, thTarget: S.thTarget, elapsed: S.elapsed});

if (isGuided()) {
  // 引导模式：完全不连后端（无 WebSocket、无 /api 请求）→ 可纯离线运行
  $('load').style.display = 'none';
  S.connected = false;
  say(GUIDED.on ? '引导模式：无需设备，点开即入' : '未连到控制台，已自动进入引导模式');
  guidedUpdate(0);
  audioPush();                          // 初始化音频参数（默认静音，不发声）
} else {
  connect();
  /* 后端不可达自动降级：连不上就切引导模式，避免给出死页面。
     3.5 秒内未 onopen 即判定不可达（本地局域网足够）。 */
  setTimeout(()=>{
    if (!S.connected && !isGuided()) {
      GUIDED.auto = true;
      try { if (ws) ws.close(); } catch(e){}
      $('load').style.display = 'none';
      say('未连到控制台，已自动进入引导模式');
      guidedUpdate(guidedElapsed());
    }
  }, 3500);
}

/* ── 3D 模型载入（本机素材） ─────────────────────────── */
async function loadModel(){
  try{
    let pick;
    if(isGuided()){
      // 引导版：不请求 /api/vr/models（离线无后端），固定用最小模型 4.glb。
      // 该模型经 SW 预缓存，装到 Pico 后离线可读。
      pick = { name: '4.glb', size_mb: 26.84 };
    } else {
      if(!S.modelList.length){
        const r = await fetch('/api/vr/models'); S.modelList = (await r.json()).models||[];
      }
      if(!S.modelList.length){ saySticky('本机暂无 3D 模型素材'); return; }
      // 选体积最小的一个先试（首屏快），后续可在控制台扩展选择
      S.modelList.sort((x,y)=>x.size_mb-y.size_mb);
      pick = S.modelList[0];
    }
    say(`载入模型 ${pick.name}（${pick.size_mb}MB）…`);
    let lastPct = -1;
    const onProg = ev => {
      if(ev.lengthComputable){
        const pct = Math.round(ev.loaded/ev.total*100);
        if(pct - lastPct >= 10 || pct === 100){
          lastPct = pct;
          say(`下载模型中 ${pct}%（${(ev.loaded/1e6).toFixed(1)}/${pick.size_mb}MB）…`);
        }
      } else {
        say(`下载模型中 ${(ev.loaded/1e6).toFixed(1)}MB…`);
      }
    };
    /* 模型 URL：引导版与脑电版走同一路径。引导版离线时由 SW 预缓存命中
       （sw.js 的 PRECACHE 已含 /api/vr/model?name=4.glb），在线时正常取。 */
    const g = await new GLTFLoader().loadAsync(
      `/api/vr/model?name=${encodeURIComponent(pick.name)}`, onProg);
    if(S.model) scene.remove(S.model);
    S.model = g.scene;
    // 归一化到 3 米高、置于水面之上
    const box = new THREE.Box3().setFromObject(S.model);
    const size = box.getSize(new THREE.Vector3());
    const k = 3/Math.max(size.y, 1e-6);
    S.model.scale.setScalar(k);
    const c = box.getCenter(new THREE.Vector3()).multiplyScalar(k);
    S.model.position.set(-c.x, -box.min.y*k, -c.z - 6);
    scene.add(S.model);
    // ── 粒子避让（法师09-12实测：粒子穿透瑜伽士身体不合理，应触碰即消失）──
    // 粒子仅垂直上升、水平坐标(x,z)终生不变 → 只需水平 footprint 判定，
    // 无需射线检测（每帧 900 次比较即可，零额外开销）。
    S.modelBox = new THREE.Box3().setFromObject(S.model);
    S.modelBox.expandByScalar(0.18);   // 外扩：在"触碰到"体表时即散，而非穿入体内
    relocateInsideParticles();         // 载入瞬间就把已在体内的粒子重排到盒外
    say('模型已载入');
  }catch(err){ saySticky('模型载入失败：'+(err && err.message ? err.message : err)); }
}
$('btnModel').onclick = loadModel;
if(INJ.autoload) loadModel();   // 截图自检：自动载入3D模型，复现法师实机场景（仅URL带autoload=1生效）
if(isGuided()) loadModel();     // 引导模式：自动载入模型 → 「点开就进入场景」，无需手点按钮

/* ── VR 进入 ─────────────────────────────────────────── */
$('btnVR').onclick = async ()=>{
  if(!navigator.xr){ say('当前浏览器不支持 WebXR（请用 Pico 浏览器打开本页）'); return; }
  try{
    const session = await navigator.xr.requestSession('immersive-vr',
      {optionalFeatures:['local-floor']});
    renderer.xr.setSession(session);
    $('btnVR').classList.add('on'); $('btnVR').textContent = '已在 VR 中';
    hud.style.display = 'none'; $('bar').style.display='none';
    session.addEventListener('end', ()=>{
      $('btnVR').classList.remove('on'); $('btnVR').textContent='进入 VR';
      hud.style.display=''; $('bar').style.display='';
    });
  }catch(err){ say('进入 VR 失败：'+err.message); }
};
$('btnTheme').onclick = ()=>{ S.autoTheme = !S.autoTheme;
  $('btnTheme').classList.toggle('on', S.autoTheme); };

/* 声音开关（裁定5：默认关闭）。
   AudioContext 必须由用户手势创建/恢复，故初始化放在点击回调内——
   页面加载时自动 new AudioContext 会被浏览器策略挂起（suspended）且无法恢复。 */
$('btnSound').onclick = async ()=>{
  if (!S.soundOn) {
    const ok = await audioInit();          // 首次点击：创建并 resume
    if (!ok) return;
    S.soundOn = true;
    if (S.audioPhase !== 'locked')
      say('声音已开启，基线采集期结束后出声（约 2 分钟）');
  } else {
    S.soundOn = false;
  }
  $('btnSound').classList.toggle('on', S.soundOn);
  $('btnSound').textContent = '声音：' + (S.soundOn ? '开' : '关');
  audioPush();                             // 立即生效（关→静音，开→按当前指令）
};

/* 冥想引导开关（2026-09-15 法师指示接入）
   点击按钮开启/关闭冥想引导（视频屏幕+音频播放器）
   开启时：显示视频屏幕、播放音频和视频（视频循环，音频单次）
   关闭时：隐藏视频屏幕、暂停音频和视频 */
$('btnMeditation').onclick = ()=>{
  if (!S.meditationOn) {
    // 开启冥想引导
    S.meditationOn = true;
    meditationScreen.visible = true;
    
    // 播放视频（循环）
    meditationVideoEl.currentTime = 0;
    meditationVideoEl.play().catch(err => {
      say('视频播放失败：' + (err && err.message ? err.message : err));
    });
    
    // 播放音频（单次，17分钟）
    meditationAudioEl.currentTime = 0;
    meditationAudioEl.play().catch(err => {
      say('音频播放失败：' + (err && err.message ? err.message : err));
    });
    
    say('冥想引导已开启（17分钟）');
  } else {
    // 关闭冥想引导
    S.meditationOn = false;
    meditationScreen.visible = false;
    
    // 暂停视频和音频
    meditationVideoEl.pause();
    meditationAudioEl.pause();
    
    say('冥想引导已关闭');
  }
  $('btnMeditation').classList.toggle('on', S.meditationOn);
  $('btnMeditation').textContent = '冥想引导：' + (S.meditationOn ? '开' : '关');
};

/* ── 主循环 ──────────────────────────────────────────── */
const clock = new THREE.Clock();
let breath = 0;
renderer.setAnimationLoop(()=>{
  const dt = clock.getDelta(), t = clock.elapsedTime;
  /* EMA 平滑：连续形式 1-exp(-dt/τ)，与帧率无关（VR 90fps 与桌面 60fps 同效）。
     在 dt=0.25s 时与验证脚本 algo_verify_2s.py 的 a=TICK_SEC/τ 相差约 1%，物理等价。
     这是"连绵不闪"的关键：τ=12s 是源数据 2s 周期的 6 倍（验证 τ≥10s 要求）。
     INJ 注入态跳过平滑、直接钉住，保证受控截图可复现。 */
  if(!INJ.active){
    const k = 1 - Math.exp(-Math.min(dt, 0.5)/ALGO.tau);   // dt 上限防切后台回来暴冲
    if(isGuided()) guidedUpdate(t);   // 引导模式：前端自主产出 S.a/S.th 目标值
    S.a  += (S.aTarget  - S.a )*k;
    S.th += (S.thTarget - S.th)*k;
  } else { S.a = INJ.a; S.th = INJ.th; if(INJ.state) S.state = INJ.state; }  // 截图自检：钉住参数（仅 URL 带参生效）
  waterU.uT.value = (INJ.active && INJ.wt!=null) ? INJ.wt : t*0.4; waterU.uA.value = S.a; waterU.uTh.value = S.th;  // 水面动画放慢到40%（原速波纹/网格光点移动过快，干扰禅修）

  if(S.autoTheme){
    const th = themeFor(S.state);
    // 帧率无关连续形式（同 EMA 处理），τ=60s → 色调缓慢流淌成底色
    const kt = 1 - Math.exp(-Math.min(dt, 0.5)/THEME.tau);
    _cCol.setHex(th.col); _cTop.setHex(th.top); _cBot.setHex(th.bot);
    curCol.lerp(_cCol, kt);
    sky.material.uniforms.uTop.value.lerp(_cTop, kt);
    sky.material.uniforms.uBot.value.lerp(_cBot, kt);
  }
  waterU.uCol.value.copy(curCol);
  /* 现实锚（维度4）：真实会话时长驱动水面极缓慢起伏。
     用 S.elapsed（后端推送的真实经过秒数）而非渲染时钟 t——
     前者是"现实中确实过去了多久"，这是虚实张力的现实侧依据；
     渲染时钟在切后台/掉帧时不连续，不能承载现实锚语义。
     300秒一周期、幅度±0.5cm：慢且微弱，只作底层暗示不成扰动。 */
  water.position.y = Math.sin(S.elapsed/ANCHOR.period*Math.PI*2)*ANCHOR.amp;
  sky.material.uniforms.uGlow.value = .2 + .8*S.a;
  scene.fog.density = .020 + .030*S.th;
  pMat.opacity = .35 + .55*S.a;
  pMat.color.copy(curCol).lerp(new THREE.Color(0xffffff), .35);

  // 引导所缘之珠：节律由 GUIDE.bpm 定（引导锚，非生理测量——本机无 PPG，见 GUIDE 注释）
  const rate = GUIDE.bpm/60;              // Hz；裁定4＝6次/分＝0.1Hz（10秒一周期）
  breath = (INJ.active && INJ.breath!=null) ? INJ.breath : breath + dt*rate*Math.PI*2;
  const s = Math.sin(breath);            // 呼吸相位 -1..1
  const inhale = (s + 1) * 0.5;          // 0..1，1=吸气顶点
  const pulse = 1.0 + GUIDE.amp*s;       // 胀缩幅度（V1 标准值 ±20%，法师：±12%太小看不出）
  orb.scale.setScalar(GUIDE.scale * pulse);   // V1 标准尺寸 0.6（法师："球太大"）；球小后±20%前表面仍只位移~7cm，不会回到"前后移动"感
  // 光色随呼吸：呼气=状态主色 curCol，吸气=过渡到亮青白（法师：加光色随呼吸变化）
  orb.material.emissive.copy(curCol).lerp(new THREE.Color(0xbfeaff), 0.55*inhale);
  // 亮度随呼吸明显起伏：吸气更亮（法师：原亮度变化不明显——此前只随缓慢的脑电S.a变，不随呼吸）
  orb.material.emissiveIntensity = 0.7 + 1.7*inhale + 0.7*S.a;

  // 粒子缓慢上升漂移（Theta 越快越"散"）
  const pos = pGeo.attributes.position;
  for(let i=0;i<PN;i++){
    let y = pos.getY(i) + dt*(.02 + .12*S.th*pSeedAt(i));  // 放慢粒子上升漂移（原速干扰禅修）
    if(y>5.5) y = .2;
    // 触碰本尊即消散（就地重生到模型范围外），不穿透、不从背面穿出
    if(S.modelBox && inModelFootprint(pos.getX(i), pos.getZ(i))){ relocateParticle(i); y = .2; }
    pos.setY(i,y);
  }
  pos.needsUpdate = true;

  // 桌面模式镜头轻微呼吸
  if(!renderer.xr.isPresenting){
    camera.position.y = 1.6 + .05*Math.sin(breath*.5);
    camera.lookAt(0,1.4,-1.6);
  }

  // HUD（桌面）
  if(!renderer.xr.isPresenting){
    if(isGuided()){
      // 引导版：无脑电数据，不显示 Alpha/Theta dB 与心率（避免无意义的「—」占位）
      hud.innerHTML =
        `<b>模式</b> 引导冥想（无需设备）<br>`+
        `<b>状态</b> ${S.state||'安定'}<br>`+
        `<b>引导所缘</b> ${GUIDE.bpm} 次/分（呼吸锚，非测量）<br>`+
        `<b>声音</b> ${S.soundOn?'开':'关（默认静音）'}`+
          `${S.beat!=null?` · 节拍 ${S.beat.toFixed(1)}Hz · 音量 ${(S.vol||0).toFixed(2)}`:''}<br>`+
        `<b>时长</b> ${S.elapsed|0}s`+
        (INJ.active?`<br><b style="color:#ffd43b">注入</b> S.a=${INJ.a} S.th=${INJ.th}`:'');
    } else {
      hud.innerHTML =
      `<b>状态</b> ${S.state||'—'} ${S.phase?('· '+S.phase):''}<br>`+
      `<b>Alpha</b> ${fmt(S.bands.alpha)} dB　<b>Theta</b> ${fmt(S.bands.theta)} dB<br>`+
      `<b>安定 S.a</b> ${S.a.toFixed(3)}　<b>沉掉 S.th</b> ${S.th.toFixed(3)}<br>`+
      `<b>引导所缘</b> ${GUIDE.bpm} 次/分（引导锚，非测量）<br>`+
      `<b>声音</b> ${S.soundOn?'开':'关（默认静音）'}`+
        `${S.beat!=null?` · 节拍 ${S.beat.toFixed(1)}Hz · 音量 ${(S.vol||0).toFixed(2)}`:''}`+
        ` · ${S.audioPhase==='locked'?'基线已锁':(S.audioPhase==='baseline'?'基线采集中':'待启动')}<br>`+
      `<b>心率</b> ${S.hr?Math.round(S.hr)+' bpm':'— （本机无 PPG 设备）'}　<b>时长</b> ${S.elapsed|0}s<br>`+
      `<b>数据源</b> ${S.connected?(S.source||'已连接'):'未连接控制台'}`+
      (INJ.active?`<br><b style="color:#ffd43b">注入</b> S.a=${INJ.a} S.th=${INJ.th}`+
        (INJ.breath!=null?` 呼吸=${INJ.breath.toFixed(2)}`:'')+
        (INJ.state?` 态=${INJ.state}`:'')+(INJ.wt!=null?` wt=${INJ.wt}`:''):'');
    }
  }
  if(msgT && Date.now()-msgT>5000){ msg.textContent=''; msgT=0; }
  renderer.render(scene,camera);
  if(firstFrame){ firstFrame=false; $('load').style.display='none'; }
});
let firstFrame = true;
function pSeedAt(i){ return pSeed[i]; }
function fmt(v){ return (v==null||isNaN(v))?'—':(+v).toFixed(1); }

/* ── 粒子避让本尊（法师 09-12 实测：粒子穿透瑜伽士不合理，应触碰即消失）──
   粒子只垂直上升、水平坐标终生不变 → 用水平 footprint 判定即可，无需射线检测。
   「消失」实现为就地重生到模型范围外的新位置（粒子数恒定，避免密度突降）。 */
function inModelFootprint(x, z){
  const b = S.modelBox;
  if(!b) return false;
  return x >= b.min.x && x <= b.max.x && z >= b.min.z && z <= b.max.z;
}
function relocateParticle(i){
  const pos = pGeo.attributes.position;
  for(let t=0; t<24; t++){
    const r = 2 + Math.random()*14, a = Math.random()*Math.PI*2;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(!inModelFootprint(x, z)){
      pos.setX(i, x); pos.setZ(i, z);
      return;
    }
  }
  pos.setZ(i, -14);   // 兜底：环内无合法位则推到远处（实测不会走到）
}
function relocateInsideParticles(){
  const pos = pGeo.attributes.position;
  let n = 0;
  for(let i=0; i<PN; i++){
    if(inModelFootprint(pos.getX(i), pos.getZ(i))){ relocateParticle(i); n++; }
  }
  if(n) pos.needsUpdate = true;
  /* 诊断暴露（与 INJ 钩子同类测试设施）：模块作用域变量 CDP 取不到，
     主动挂 window 供实机核验穿透是否消除——insideAfter 必须为 0。 */
  window.__vrDiag = {
    relocated: n, total: PN,
    box: S.modelBox ? {
      x0:+S.modelBox.min.x.toFixed(3), x1:+S.modelBox.max.x.toFixed(3),
      y0:+S.modelBox.min.y.toFixed(3), y1:+S.modelBox.max.y.toFixed(3),
      z0:+S.modelBox.min.z.toFixed(3), z1:+S.modelBox.max.z.toFixed(3) } : null,
    insideAfter: (()=>{ let c=0; for(let i=0;i<PN;i++) if(inModelFootprint(pos.getX(i),pos.getZ(i))) c++; return c; })(),
    /* 模型在屏幕上的投影矩形（归一化 0..1）——供视觉层按真实投影区取样，
       不靠猜分区（本轮已三次因猜分区误判，故一律用页面自己的 camera 投影） */
    screenRect: (()=>{
      try{
        if(!S.modelBox) return null;
        camera.lookAt(0,1.4,-1.6); camera.updateMatrixWorld();
        const b=S.modelBox, xs=[], ys=[];
        for(const X of [b.min.x,b.max.x]) for(const Y of [b.min.y,b.max.y]) for(const Z of [b.min.z,b.max.z]){
          const p=new THREE.Vector3(X,Y,Z).project(camera);
          xs.push((p.x+1)/2); ys.push((1-p.y)/2);
        }
        return {x0:+Math.min(...xs).toFixed(4), x1:+Math.max(...xs).toFixed(4),
                y0:+Math.min(...ys).toFixed(4), y1:+Math.max(...ys).toFixed(4)};
      }catch(e){ return null; }
    })(),
  };
  return n;
}

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
<script>
/* ── PWA：注册 Service Worker（2026-09-12 法师裁定：打包为 Pico 通用应用）──
   仅安全上下文（HTTPS 或 localhost）可注册——WebXR 与 SW 同此要求。
   sw.js 从根路径提供，scope 默认 '/'，故能控制 /vr 页面。
   注册失败不影响场景运行（引导模式本就不依赖 SW，SW 只为离线加速）。 */
if ('serviceWorker' in navigator && (location.protocol === 'https:' ||
    location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .then(function(reg){
        console.log('[PWA] SW 已注册, scope=', reg.scope);
        window.__swOK = true;
      })
      .catch(function(err){
        console.warn('[PWA] SW 注册失败（不影响使用）：', err);
        window.__swOK = false;
      });
  });
} else {
  window.__swOK = false;   // 非安全上下文（如 http://局域网IP）：不注册，页面仍可用
}

/* 看门狗：8 秒仍停在加载层则展示失败原因 */
setTimeout(function(){
  var l = document.getElementById('load');
  if(l && l.style.display !== 'none'){
    l.textContent = '加载异常：' + (window.__vrErr || '3D 引擎未能初始化');
    l.style.color = '#ff9d9d';
  }
}, 8000);
</script>
